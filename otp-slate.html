<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OTP Slate — Learning Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=JetBrains+Mono:wght@400;500;700&family=Lato:ital,wght@0,400;0,700;0,900;1,400&display=swap" rel="stylesheet">
<style>
/* 01-tokens.css: Design tokens (light/dark), safe-area padding, base elements. */
:root{--ground:#eceff3;--surface:#ffffff;--surface-2:#f5f7fa;--ink:#0f2747;--ink-2:#4b5b73;--ink-3:#7b8799;--rule:#cdd5df;--cobalt:#2743d1;--cobalt-ink:#fff;--marker:#ffe066;--marker-ink:#352a00;--wa:#1f9d55;--ok:#2f8f5b;--late:#b4441f;--r-frame:14px;--r-panel:10px;--r-btn:8px;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ground:#0c1524;--surface:#132137;--surface-2:#0f1b2e;--ink:#e6ecf5;--ink-2:#a3b2c9;--ink-3:#73839b;--rule:#25354e;--cobalt:#93a5ff;--cobalt-ink:#0c1524;--marker:#e9c94a;--marker-ink:#231b00;--wa:#43cf7c;--ok:#5cc28d;--late:#ff8a63;color-scheme:dark}}
:root[data-theme="dark"]{--ground:#0c1524;--surface:#132137;--surface-2:#0f1b2e;--ink:#e6ecf5;--ink-2:#a3b2c9;--ink-3:#73839b;--rule:#25354e;--cobalt:#93a5ff;--cobalt-ink:#0c1524;--marker:#e9c94a;--marker-ink:#231b00;--wa:#43cf7c;--ok:#5cc28d;--late:#ff8a63;color-scheme:dark}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 72px);scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{animation:none!important;transition:none!important}}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font:16px/1.6 Lato,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--cobalt);outline-offset:2px}
a{color:var(--cobalt)}
mark{background:var(--marker);color:var(--marker-ink);padding:0 .25em;border-radius:3px}
.sp{flex:1}
.disp{font-family:"Bricolage Grotesque",Lato,sans-serif}

/* 03-lms.css: OTP Slate LMS shell (always light): rail, dashboard cards, catalog, course modules, calendar, inbox, grades, trays, Otto pet, WhatsApp sign-in. */
/* ===== LMS app (product mock, fixed light) ===== */
.app{position:relative;display:flex;height:760px;background:#fff;color:#2d3b45;font:15px/1.45 Lato,Arial,sans-serif;overflow:hidden;color-scheme:light}
.app a{color:#1f5fae}
.a-rail{width:86px;flex:none;background:#0f2747;display:flex;flex-direction:column;overflow-y:auto;scrollbar-width:none;z-index:22}
.a-logo{display:grid;place-items:center;padding:12px 0 10px}
.a-nav{appearance:none;border:0;background:none;color:#fff;font:400 12.5px/1.2 Lato,Arial,sans-serif;display:flex;flex-direction:column;align-items:center;gap:5px;padding:10px 2px;text-decoration:underline;text-underline-offset:3px;position:relative}
.a-nav svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.a-nav.on{background:#fff;color:#0f2747;text-decoration:none}
.a-nav:focus-visible{outline:2px solid #ffe066;outline-offset:-3px}
.a-nav .cnt{position:absolute;top:6px;right:16px;background:#e0402b;color:#fff;font:700 10.5px/16px Lato,Arial,sans-serif;min-width:16px;height:16px;border-radius:8px;text-decoration:none}
.a-av{width:32px;height:32px;border-radius:50%;background:#e9eef5;border:2px solid #fff;color:#0f2747;font:900 12px/28px Lato,Arial,sans-serif;text-decoration:none}
.a-nav.on .a-av{border-color:#0f2747}
.a-main{flex:1;min-width:0;overflow-y:auto;position:relative;scroll-behavior:auto}
.a-page{padding:26px 34px 70px}
.a-h1{font:400 34px/1.15 Lato,Arial,sans-serif;margin:0;color:#2d3b45}
.a-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;border-bottom:1px solid #c7cdd1;padding-bottom:16px;margin-bottom:24px}
.a-btn{border:1px solid #c7cdd1;background:#f5f5f5;color:#2d3b45;border-radius:4px;padding:7px 13px;font:15px Lato,Arial,sans-serif;display:inline-flex;align-items:center;gap:7px;text-decoration:none}
.a-btn:hover{background:#ebeef0}
.a-btn.pri{background:#0f2747;color:#fff;border-color:#0f2747}
.a-btn.pri:hover{background:#18365f}
.a-btn.hl{background:#ffe066;border-color:#e8c93f;color:#352a00;font-weight:700}
.a-btn svg,.a-ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.a-kebab{appearance:none;border:0}
.a-dash{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:34px}
.a-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:26px 28px;align-content:start}
.a-card{border-radius:5px;box-shadow:0 2px 5px rgba(0,0,0,.16),0 2px 3px rgba(0,0,0,.08);overflow:hidden;background:#fff;display:flex;flex-direction:column;cursor:pointer;outline-offset:3px}
.a-card:hover{box-shadow:0 4px 12px rgba(0,0,0,.2)}
.a-hero{height:138px;position:relative;overflow:hidden}
.a-glyph{position:absolute;left:16px;bottom:-14px;font:900 64px/1 Lato,Arial,sans-serif;color:rgba(255,255,255,.3);letter-spacing:-.04em}
.a-kebab{position:absolute;top:12px;right:12px;width:32px;height:32px;border-radius:50%;background:rgba(0,0,0,.32);color:#fff;font-size:18px;line-height:1}
.a-cbody{padding:14px 18px 4px}
.a-ctitle{font-weight:700;text-decoration:underline;font-size:16px}
.a-ccode{text-decoration:underline;font-size:15px;color:#2d3b45;opacity:.9;margin-top:2px}
.a-cterm{font-size:12.5px;color:#6b7780;text-decoration:underline}
.a-cicons{display:flex;gap:30px;padding:10px 18px 14px;color:#6b7780;margin-top:auto}
.a-cicons span{position:relative}
.a-cicons b{position:absolute;top:-7px;right:-10px;background:#1f5fae;color:#fff;font:700 10px/15px Lato,Arial,sans-serif;min-width:15px;height:15px;border-radius:8px;text-align:center}
.a-aside .wm{display:flex;align-items:center;gap:10px;margin:2px 0 24px;color:#0f2747}
.wm-t{font:900 17px/1 Lato,Arial,sans-serif;letter-spacing:.01em}.wm-t span{font-weight:400;display:block;font-size:13px;color:#4b5b73;margin-top:3px}
.a-aside h3{font:700 18px Lato,Arial,sans-serif;border-bottom:1px solid #c7cdd1;padding-bottom:8px;margin:22px 0 6px}
.todo{display:flex;gap:10px;padding:9px 0;font-size:14px;border-bottom:1px solid #eef0f2;cursor:pointer;width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left}
.todo:hover .tt{text-decoration:underline}
.todo .tt{color:#1f5fae;font-weight:700;display:block}
.todo small{color:#6b7780;display:block}
.dot{width:10px;height:10px;border-radius:50%;flex:none;margin-top:5px}
.a-crumbs{font-size:14px;margin:0 0 14px;color:#6b7780;display:flex;gap:6px;flex-wrap:wrap}
.a-crumbs button{border:0;background:none;color:#1f5fae;padding:0;text-decoration:underline}
.a-filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px;align-items:center}
.a-pill{border:1px solid #c7cdd1;background:#fff;border-radius:999px;padding:5px 12px;font:14px Lato,Arial,sans-serif;color:#2d3b45}
.a-pill.on{background:#0f2747;color:#fff;border-color:#0f2747}
.a-search{border:1px solid #c7cdd1;border-radius:4px;padding:7px 11px;min-width:220px;font:14px Lato,Arial,sans-serif;margin-left:auto}
.a-cat h2{font:700 21px Lato,Arial,sans-serif;margin:26px 0 2px}
.a-cat>p{margin:0 0 10px;color:#6b7780;font-size:14px}
.a-cat h3{font:700 14px Lato,Arial,sans-serif;color:#4b5b73;margin:16px 0 8px}
.a-cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.a-row{display:flex;gap:12px;border:1px solid #d7dde2;border-radius:6px;padding:12px;background:#fff;align-items:flex-start;text-align:left;width:100%}
.a-row:hover{border-color:#1f5fae;background:#fbfdff}
.a-sw{width:46px;height:46px;border-radius:6px;flex:none;color:#fff;display:grid;place-items:center;font:900 13px Lato,Arial,sans-serif}
.a-row b{display:block;font-size:15px;color:#1f5fae}
.a-row small{color:#6b7780;font-size:13px}
.a-tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.a-tag{font-size:11.5px;border-radius:4px;padding:1px 6px;background:#eef2f7;color:#34445a}
.a-tag.en{background:#e1f3e8;color:#1c6a3e}
.a-tag.ide{background:#fff4c2;color:#5b4700}
.a-tag.soon{background:#fdecc8;color:#7a4b00}
.co-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.co{border:1px solid #d7dde2;border-radius:6px;padding:14px 10px;text-align:center;background:#fff;font:700 14px Lato,Arial,sans-serif;color:#2d3b45;position:relative}
.co small{display:block;font-weight:400;color:#6b7780;font-size:12px}
.co.soon{color:#8a949c;background:#fafbfc}
.co.soon::after{content:"";position:absolute;top:7px;right:7px;width:9px;height:9px;border-radius:50%;background:#f0b429}
.co:not(.soon)::after{content:"";position:absolute;top:7px;right:7px;width:9px;height:9px;border-radius:50%;background:#2f80ed}

/* course */
.a-course{display:grid;grid-template-columns:170px minmax(0,1fr) 250px;gap:26px}
.a-cnav{display:flex;flex-direction:column;font-size:15px}
.a-cnav button{border:0;background:none;text-align:left;padding:6px 10px;border-left:3px solid transparent;color:#1f5fae}
.a-cnav button.on{border-left-color:#2d3b45;color:#2d3b45;font-weight:700}
.a-banner{border-radius:6px;color:#fff;padding:18px 20px;min-height:118px;display:flex;flex-direction:column;justify-content:flex-end;position:relative;overflow:hidden;margin-bottom:14px}
.a-banner h1{font:900 26px/1.1 Lato,Arial,sans-serif;margin:0;position:relative}
.a-banner p{margin:4px 0 0;opacity:.9;font-size:14px;position:relative}
.a-prog{display:flex;align-items:center;gap:12px;margin:0 0 16px;font-size:14px;flex-wrap:wrap}
.a-bar{flex:1;min-width:120px;height:8px;background:#e6e9ec;border-radius:4px;overflow:hidden}.a-bar i{display:block;height:100%;background:#2f8f5b}
.a-mod{border:1px solid #c7cdd1;border-radius:4px;margin-bottom:14px;overflow:hidden}
.a-mod-h{background:#f5f5f5;padding:10px 14px;display:flex;align-items:center;gap:10px;font-weight:700;width:100%;border:0;text-align:left;color:#2d3b45}
.a-mod-h .req{margin-left:auto;font-weight:400;font-size:13px;color:#6b7780}
.a-item{display:flex;align-items:center;gap:12px;padding:10px 14px;border-top:1px solid #e6e9ec;width:100%;background:#fff;border-left:0;border-right:0;border-bottom:0;text-align:left;color:#2d3b45}
.a-item:hover{background:#f6f9fc}
.a-item .nm{flex:1;min-width:0}
.a-item .nm b{font-weight:400;color:#1f5fae}
.a-item .nm small{display:block;color:#6b7780;font-size:12.5px}
.a-item .st{width:22px;height:22px;border-radius:50%;border:2px solid #c7cdd1;flex:none;display:grid;place-items:center}
.a-item.done .st{background:#2f8f5b;border-color:#2f8f5b;color:#fff}
.a-item.next{box-shadow:inset 3px 0 #ffe066;background:#fffdf0}
.a-mod.locked .a-item{color:#9aa4ac;cursor:not-allowed}
.a-mod.locked .a-item b{color:#9aa4ac}
.a-side h4{font:700 15px Lato,Arial,sans-serif;margin:0 0 8px;border-bottom:1px solid #c7cdd1;padding-bottom:6px}
.a-side .blk{margin-bottom:20px;font-size:14px}
.a-side .blk p{margin:4px 0}
.a-switch{display:flex;gap:8px;align-items:center;font-size:13px;color:#4b5b73;margin-top:8px}

/* lesson */
.a-lesson{max-width:840px}
.a-lesson h1{font:400 30px/1.2 Lato,Arial,sans-serif;margin:0 0 4px}
.a-meta{color:#6b7780;font-size:14px;margin:0 0 16px}
.a-lesson p{max-width:72ch}
.a-code{border-radius:8px;overflow:hidden;margin:18px 0;background:#1f1f1f;color:#ccc}
.a-code-h{display:flex;align-items:center;gap:10px;padding:8px 10px 8px 14px;background:#181818;font:12px "JetBrains Mono",monospace;color:#9d9d9d;flex-wrap:wrap}
.a-code pre{margin:0;padding:14px 16px;font:13px/1.6 "JetBrains Mono",monospace;overflow-x:auto;color:#ccc}
.a-play{margin-left:auto;background:#ffe066;color:#352a00;border:0;border-radius:6px;padding:7px 12px;font:900 13px Lato,Arial,sans-serif;display:inline-flex;gap:7px;align-items:center}
.a-play svg{width:14px;height:14px}
.a-copy{background:#2b2b2b;color:#ddd;border:0;border-radius:6px;padding:6px 10px;font:12px Lato,Arial,sans-serif}
.a-check{border:1px solid #d7dde2;border-radius:6px;padding:12px 16px;background:#fafbfc}
.a-check label{display:flex;gap:10px;padding:4px 0;font-size:14.5px}
.a-seq{display:flex;justify-content:space-between;gap:10px;border-top:1px solid #c7cdd1;margin-top:30px;padding-top:14px}
.a-launch{border:1px solid #d7dde2;border-radius:8px;padding:18px;display:flex;gap:16px;align-items:center;background:linear-gradient(90deg,#fffbe6,#fff);flex-wrap:wrap}
.a-launch b{font-size:17px}
.a-kv{display:grid;grid-template-columns:150px 1fr;gap:6px 14px;font-size:14.5px;margin:14px 0}
.a-kv dt{color:#6b7780}.a-kv dd{margin:0}
.a-note{font-size:13px;color:#6b7780;margin-top:18px;font-style:italic}

/* calendar */
.a-cal{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:22px}
.cal-h{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.cal-h h2{font:400 24px Lato,Arial,sans-serif;margin:0 8px 0 4px}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid #c7cdd1;border-left:1px solid #c7cdd1}
.cal-dow{font-size:12px;font-weight:700;color:#6b7780;padding:6px;border-right:1px solid #c7cdd1;border-bottom:1px solid #c7cdd1;background:#f5f5f5;text-align:center}
.cal-d{min-height:92px;border-right:1px solid #c7cdd1;border-bottom:1px solid #c7cdd1;padding:4px;font-size:12px;min-width:0}
.cal-d.out{background:#fafbfc;color:#a3acb3}
.cal-d .n{display:inline-grid;place-items:center;width:22px;height:22px;font-weight:700}
.cal-d.today .n{background:#0f2747;color:#fff;border-radius:50%}
.ev{display:flex;gap:4px;align-items:center;width:100%;text-align:left;border:0;border-left:3px solid;background:#f1f4f8;padding:2px 4px;margin-top:3px;border-radius:2px;font:12px/1.3 Lato,Arial,sans-serif;white-space:nowrap;overflow:hidden;color:#2d3b45}
.ev span{overflow:hidden;text-overflow:ellipsis}
.ev .ty{font-size:9.5px;font-weight:900;flex:none;color:#4b5b73}
.ev.exam{background:#fdeceb}.ev.deadline{background:#fff6dc}.ev.project{background:#ece9fb}.ev.class{background:#e8f2fc}
.cal-more{font-size:11px;color:#1f5fae;padding:2px 4px}
.cal-key{display:flex;flex-direction:column;gap:6px;font-size:14px}
.cal-key label{display:flex;gap:8px;align-items:center}
.cal-key i{width:12px;height:12px;border-radius:3px}
.ag{border:1px solid #d7dde2;border-radius:6px;overflow:hidden}
.ag-d{background:#f5f5f5;padding:6px 12px;font-weight:700;font-size:14px;border-top:1px solid #d7dde2}
.ag-d:first-child{border-top:0}
.ag-e{display:flex;gap:12px;padding:9px 12px;border-top:1px solid #eef0f2;font-size:14px;align-items:center;width:100%;background:#fff;border-left:0;border-right:0;border-bottom:0;text-align:left;color:#2d3b45}
.ag-e .tm{width:72px;color:#6b7780;flex:none;font-size:13px}
.evd{border:1px solid #d7dde2;border-radius:6px;padding:12px;margin-top:16px;font-size:14px;background:#fafbfc}
.evd b{display:block;font-size:15px;margin-bottom:4px}

/* inbox */
.a-inbox{display:grid;grid-template-columns:330px minmax(0,1fr);border:1px solid #c7cdd1;border-radius:4px;height:560px}
.ib-list{border-right:1px solid #c7cdd1;overflow-y:auto}
.ib-i{display:block;width:100%;text-align:left;padding:11px 14px 11px 22px;border:0;border-bottom:1px solid #e6e9ec;background:#fff;position:relative;color:#2d3b45}
.ib-i.unread::before{content:"";position:absolute;left:8px;top:17px;width:8px;height:8px;border-radius:50%;background:#1f5fae}
.ib-i.on{background:#e8f0fb}
.ib-i .fr{display:flex;gap:8px;font-weight:700;font-size:14px}
.ib-i .fr time{margin-left:auto;font-weight:400;color:#6b7780;font-size:12.5px}
.ib-i .sj{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib-i .rl{font-size:12px;color:#6b7780}
.ib-view{padding:20px 26px;overflow-y:auto}
.ib-view h2{font:400 24px/1.2 Lato,Arial,sans-serif;margin:0 0 10px}
.ib-from{display:flex;gap:12px;align-items:center;margin-bottom:16px;font-size:14px}
.ib-from .av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:900}
.ib-body{font-size:15px;line-height:1.6;max-width:68ch}
.ib-compose{display:grid;gap:10px;max-width:620px}
.ib-compose input,.ib-compose select,.ib-compose textarea{border:1px solid #c7cdd1;border-radius:4px;padding:8px 10px;font:14.5px Lato,Arial,sans-serif;width:100%}
.role{font-size:11px;font-weight:700;border-radius:4px;padding:1px 6px;background:#eef2f7;color:#34445a}
.role.Instructor{background:#e6f0ff;color:#1d4fa0}.role.Admin{background:#fde7e4;color:#a2321f}.role.System{background:#eef0f2;color:#4b5b73}.role.Course.Manager,.role.Manager{background:#efe8fc;color:#5b33a6}

/* grades */
.g-tab{width:100%;border-collapse:collapse;font-size:14.5px}
.g-tab th,.g-tab td{text-align:left;padding:10px 12px;border-bottom:1px solid #e6e9ec}
.g-tab th{font-size:13px;color:#6b7780;font-weight:700}
.g-tab td b{color:#1f5fae}

/* trays */
.a-tray{position:absolute;top:0;bottom:0;left:86px;width:min(330px,80%);background:#fff;box-shadow:8px 0 30px rgba(0,0,0,.2);z-index:21;transform:translateX(-110%);transition:transform .22s ease;padding:22px 24px;overflow-y:auto}
.a-tray.open{transform:none}
.a-tray h2{font:400 22px Lato,Arial,sans-serif;margin:0 0 16px}
.a-tray .x{position:absolute;top:14px;right:14px;border:0;background:none;font-size:22px;color:#6b7780}
.tray-l{list-style:none;margin:0;padding:0}
.tray-l li{border-bottom:1px solid #eef0f2}
.tray-l button{border:0;background:none;padding:10px 0;width:100%;text-align:left;color:#1f5fae;font-size:15px}
.tray-l small{display:block;color:#6b7780;font-size:12.5px}
.prof{display:flex;flex-direction:column;align-items:center;gap:6px;margin-bottom:16px;text-align:center}
.prof .big{width:72px;height:72px;border-radius:50%;background:#e9eef5;display:grid;place-items:center;font:900 24px Lato,Arial,sans-serif;color:#0f2747}
.wa-link{display:flex;gap:8px;align-items:center;background:#e9f8ef;color:#185c34;border-radius:6px;padding:8px 10px;font-size:13.5px;margin:6px 0 14px}

/* pet */
.pet{position:absolute;right:18px;bottom:14px;z-index:25;width:78px;height:78px;border:0;background:none;padding:0;filter:drop-shadow(0 6px 10px rgba(15,39,71,.35))}
.pet svg{width:100%;height:100%;overflow:visible}
.pet .bob{animation:bob 3.2s ease-in-out infinite;transform-origin:50% 90%}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.pet .lid{animation:blink 5s infinite;transform-origin:center;transform-box:fill-box}

/* login */

.lg-art{color:#fff;padding:48px;display:flex;flex-direction:column;justify-content:space-between;background:radial-gradient(circle at 80% 20%,rgba(255,224,102,.18),transparent 45%)}

/* 05-ide.css: Modal, code editor (textarea + highlighted <pre>), token colours, and the five IDE skins (IntelliJ, VS Code, Jupyter, Workbench, mongosh) plus the replay dock. */
/* ===== modal + IDEs ===== */
.modal{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;background:rgba(6,12,24,.66);padding:calc(env(safe-area-inset-top,0px) + 12px) 12px calc(env(safe-area-inset-bottom,0px) + 12px)}
.modal.open{display:flex}
.mc{width:min(1260px,100%);height:min(820px,100%);display:flex;flex-direction:column;border-radius:12px;overflow:hidden;background:#1e1f22;box-shadow:0 40px 90px rgba(0,0,0,.55);color-scheme:light}
.mc-head{display:flex;align-items:center;gap:12px;padding:7px 8px 7px 16px;background:#0f2747;color:#fff;font:14px Lato,Arial,sans-serif;flex:none;min-height:46px}
.mc-head .ttl{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mc-head .ttl b{font-weight:900}
.mc-head .ttl span{opacity:.75}
.mc-tabs{display:flex;gap:2px;background:rgba(255,255,255,.1);border-radius:8px;padding:3px;flex:none}
.mc-tabs button{border:0;background:none;color:#cfd8e6;border-radius:6px;padding:4px 11px;font:700 13px Lato,Arial,sans-serif}
.mc-tabs button.on{background:#fff;color:#0f2747}
.mc-x{border:0;background:rgba(255,255,255,.1);color:#fff;width:32px;height:32px;border-radius:8px;font-size:18px;flex:none}
.mc-head .ttl{flex:1}
.mc-body{flex:1;min-height:0;display:flex;flex-direction:column}
.ide{flex:1;min-height:0;display:flex;flex-direction:column;font:13px/1.4 -apple-system,"Segoe UI",system-ui,sans-serif}
.ide svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ide button{background:none;border:0;color:inherit}

.ed{position:relative;flex:1;min-height:0;display:flex;background:var(--bg);color:var(--fg)}
.ed-scroll{flex:1;overflow:auto;display:flex;align-items:flex-start;min-height:100%}
.ed-auto{flex:none}
.ed-auto .ed-scroll{overflow-x:auto;overflow-y:hidden;min-height:0}
.ed-gut{position:sticky;left:0;z-index:2;flex:none;padding:10px 0;text-align:right;min-width:44px;font:13px/20px "JetBrains Mono",monospace;user-select:none;background:var(--bg);color:var(--gut)}
.ed-gut div{padding:0 10px 0 8px;height:20px;position:relative}
.ed-gut div.run::before{content:"";position:absolute;left:4px;top:5px;border-left:8px solid #5fb865;border-top:5px solid transparent;border-bottom:5px solid transparent}
.ed-gut div.cur{color:var(--fg)}
.ed-sizer{position:relative;flex:1 0 auto;min-height:100%}
.ed-pre,.ed-ta{margin:0;padding:10px 16px 10px 10px;font:13px/20px "JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;white-space:pre;tab-size:4;letter-spacing:0;border:0;word-spacing:0}
.ed-pre{pointer-events:none;color:var(--fg);position:relative;z-index:1}
.ed-ta{position:absolute;inset:0;width:100%;height:100%;resize:none;background:transparent;color:transparent;caret-color:var(--caret);outline:none;overflow:hidden;z-index:2}
.ed-ta::selection{background:rgba(110,150,255,.35)}
.ed-band{position:absolute;left:0;right:0;display:none;background:var(--band,rgba(255,224,102,.14));box-shadow:inset 3px 0 #ffe066;pointer-events:none;z-index:0;transition:top .18s ease,height .18s ease}
.ed-note{position:absolute;left:24px;display:none;max-width:440px;width:max-content;background:#ffe066;color:#2a2200;font:700 12.5px/1.4 Lato,sans-serif;padding:7px 10px;border-radius:6px;box-shadow:0 8px 20px rgba(0,0,0,.35);pointer-events:none;z-index:3;white-space:normal}
.ed-note::before{content:"";position:absolute;top:-6px;left:16px;border:6px solid transparent;border-top:0;border-bottom-color:#ffe066}
.t-k{color:var(--k)}.t-s{color:var(--s)}.t-n{color:var(--n)}.t-c{color:var(--c);font-style:italic}.t-f{color:var(--f)}.t-t{color:var(--t)}.t-pp{color:var(--pp,var(--k))}.t-tag{color:var(--k)}.t-attr{color:var(--t)}.t-p{color:var(--c)}
.vlist{font:12.5px/1.5 "JetBrains Mono",monospace}
.vrow{display:flex;gap:6px;padding:2px 12px;white-space:nowrap}
.vrow .vn{color:var(--vn,#c77dbb)}.vrow .vv{color:var(--vv,#6aab73);overflow:hidden;text-overflow:ellipsis}
.vrow.ch{background:rgba(255,224,102,.16)}
.vempty{padding:8px 12px;color:var(--gut);font:12.5px Lato,sans-serif}

.mg-edc{display:flex;flex-direction:column;min-width:0;border-right:1px solid #0b3b4f}
.mg-tab{padding:6px 14px;background:#001e2b;border-bottom:1px solid #0b3b4f;font-size:12.5px;color:#c1c7c6;flex:none}
.mg-term{margin:0;padding:12px 16px;font:13px/1.55 "JetBrains Mono",monospace;overflow:auto;background:#000f17;color:#e3fcf7;white-space:pre-wrap}
.mg-term .pr{color:#00ed64}

.wt-dock{flex:none;display:flex;align-items:center;gap:14px;padding:10px 14px;background:#0f2747;color:#fff;position:relative;font-family:Lato,sans-serif}
.wt-ctl{display:flex;gap:4px;flex:none}
.wt-ctl button{width:36px;height:34px;border-radius:8px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.06);color:#fff;display:grid;place-items:center}
.wt-ctl button:hover{background:rgba(255,255,255,.14)}
.wt-ctl svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.wt-ctl .pp{background:#ffe066;color:#2a2200;border-color:#ffe066;width:46px}
.wt-ctl .pp svg{fill:currentColor;stroke:none}
.wt-info{flex:1;min-width:0}
.wt-step{font-size:12px;color:#a9b8d0}
.wt-note{font-size:15px;line-height:1.35}
.wt-dock select{background:rgba(255,255,255,.08);color:#fff;border:1px solid rgba(255,255,255,.2);border-radius:6px;padding:5px 6px;font-size:13px;flex:none}
.wt-dock select option{color:#111}
.wt-bar{position:absolute;left:0;right:0;top:0;height:3px;background:rgba(255,255,255,.08)}
.wt-bar i{display:block;height:100%;width:0;background:#ffe066;transition:width .3s}
.wt-run{flex:none;background:#fff;color:#0f2747;border:0;border-radius:8px;padding:8px 12px;font:900 13px Lato,Arial,sans-serif;display:flex;gap:6px;align-items:center}
.wt-run svg{width:12px;height:12px;fill:currentColor;stroke:none}

/* 06-exam.css: Exam frame: top bar, timer, proctoring signals, question pane, test verdicts, submit overlay. */
/* exam */
.ex{flex:1;min-height:0;display:flex;flex-direction:column;background:#f4f6f9;color:#1d2735;font-family:Lato,sans-serif}
.ex-top{display:flex;align-items:center;gap:14px;padding:9px 14px;background:#fff;border-bottom:1px solid #dde3ea;flex:none;flex-wrap:wrap}
.ex-top h3{margin:0;font:900 16px Lato,Arial,sans-serif}
.ex-top small{color:#64748b;font-size:13px}
.ex-tm{font:700 17px "JetBrains Mono",monospace;background:#0f2747;color:#fff;border-radius:8px;padding:4px 10px}
.ex-tm.low{background:#b4441f}
.ex-pc{display:flex;gap:12px;font-size:12.5px;color:#4b5b73;flex-wrap:wrap}
.ex-pc span{display:flex;align-items:center;gap:5px}
.ex-pc span::before{content:"";width:8px;height:8px;border-radius:50%;background:#2f8f5b}
.ex-pc span.warn::before{background:#d97706}
.ex-sub{background:#0f2747;color:#fff;border:0;border-radius:8px;padding:8px 14px;font:900 14px Lato,Arial,sans-serif;margin-left:auto}
.ex-body{flex:1;min-height:0;display:grid;grid-template-columns:minmax(280px,.75fr) minmax(0,1.6fr)}
.ex-l{overflow:auto;padding:16px 18px;border-right:1px solid #dde3ea;background:#fff}
.ex-l h2{font:900 24px Lato,Arial,sans-serif;margin:6px 0 6px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ex-l h5{font:900 13px Lato,Arial,sans-serif;color:#475569;margin:16px 0 6px}
.ex-l pre{background:#f3f5f8;border:1px solid #e2e8f0;border-radius:6px;padding:10px;font:12.5px/1.55 "JetBrains Mono",monospace;white-space:pre-wrap;margin:0}
.ex-l p{margin:0;font-size:14.5px;line-height:1.55}
.pill{font:700 11.5px Lato,Arial,sans-serif;border-radius:999px;padding:2px 8px;background:#e6f6ec;color:#1c6a3e}
.pill.b{background:#e6efff;color:#1d4fa0}
.qn{display:flex;gap:6px;flex-wrap:wrap}
.qn button{width:34px;height:34px;border-radius:8px;border:1px solid #c9d1dc;background:#fff;font:900 14px Lato,Arial,sans-serif;color:#1d2735}
.qn button.on{background:#0f2747;color:#fff;border-color:#0f2747}
.ex-r{display:flex;flex-direction:column;min-width:0;min-height:0}
.ex-lang{display:flex;gap:2px;padding:6px 10px;background:#e9edf3;border-bottom:1px solid #dde3ea;flex:none;align-items:center;flex-wrap:wrap}
.ex-lang button{border:0;background:none;border-radius:6px;padding:4px 12px;font:700 13px Lato,Arial,sans-serif;color:#334155}
.ex-lang button.on{background:#1f5fae;color:#fff}
.ex-lang small{margin-left:auto;color:#64748b;font-size:12px}
.ex-ide{flex:1;min-height:0;display:flex;flex-direction:column}
.ex-act{display:flex;gap:8px;align-items:center;padding:8px 12px;background:#fff;border-top:1px solid #dde3ea;flex:none}
.ex-act button{border:1px solid #c9d1dc;background:#fff;border-radius:8px;padding:7px 14px;font:700 14px Lato,Arial,sans-serif;color:#1d2735}
.ex-act button.pri{background:#1f9d55;border-color:#1f9d55;color:#fff}
.ex-act small{color:#64748b}
.tres{border:1px solid #e2e8f0;border-radius:8px;overflow:hidden;margin-top:6px}
.tres .trh{padding:8px 10px;background:#f8fafc;font-weight:900;font-size:13.5px;display:flex;gap:8px}
.trow{display:grid;grid-template-columns:62px minmax(0,1fr);gap:10px;padding:7px 10px;border-top:1px solid #eef1f4;font:12.5px/1.45 "JetBrains Mono",monospace}
.trow .v{font-weight:700}
.pass{color:#1f8a4c}.fail{color:#c0392b}.wait{color:#64748b}
.ex-ov{position:absolute;inset:0;background:rgba(15,23,42,.55);display:grid;place-items:center;z-index:5}
.ex-ov>div{background:#fff;border-radius:12px;padding:22px 24px;max-width:420px;width:calc(100% - 32px)}
.ex-ov h3{margin:0 0 8px;font:900 20px Lato,Arial,sans-serif}
.ex-ov .row{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.ex-ov button{border:1px solid #c9d1dc;background:#fff;border-radius:8px;padding:8px 14px;font:700 14px Lato,Arial,sans-serif}
.ex-ov button.pri{background:#0f2747;color:#fff;border-color:#0f2747}

/* 07-labs.css: Interactive labs (quant, direction sense, typing, STAR, MCQ engine) and the toast. */
/* labs */
.lab{flex:1;min-height:0;overflow:auto;background:#f6f7fb;color:#1d2735;font-family:Lato,sans-serif;padding:22px 26px 40px}
.lab h2{font:900 24px/1.15 Lato,Arial,sans-serif;margin:0 0 4px}
.lab .lead{margin:0 0 18px;color:#4b5b73;max-width:70ch}
.lab-2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:22px}
.lab-c{background:#fff;border:1px solid #e1e6ee;border-radius:10px;padding:16px 18px}
.lab-c h4{margin:0 0 10px;font:900 15px Lato,Arial,sans-serif}
.sl{display:grid;gap:4px;margin-bottom:14px}
.sl label{display:flex;justify-content:space-between;font-size:14px}
.sl output{font-weight:900}
.sl input{width:100%;accent-color:#0f2747}
.qbar{display:grid;grid-template-columns:96px minmax(0,1fr) 90px;gap:10px;align-items:center;margin:10px 0;font-size:14px}
.qbar i{height:26px;border-radius:5px;background:#e6e9ef;position:relative;overflow:hidden;display:block}
.qbar i b{position:absolute;inset:0 auto 0 0;border-radius:5px;transition:width .25s}
.qbar span{text-align:right;font-weight:900}
.work{font:14px/1.9 "JetBrains Mono",monospace;background:#0f2747;color:#e6ecf5;border-radius:8px;padding:12px 16px;margin-top:14px;overflow-x:auto}
.work .hl{color:#ffe066}
.chal{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px;font-size:14.5px}
.chal input{width:80px;border:1px solid #c9d1dc;border-radius:6px;padding:6px 8px}
.lbtn{border:1px solid #c9d1dc;background:#fff;border-radius:8px;padding:7px 14px;font:700 14px Lato,Arial,sans-serif;color:#1d2735}
.lbtn.pri{background:#0f2747;color:#fff;border-color:#0f2747}
.fb{font-size:14px;margin-top:8px}.fb.ok{color:#1f8a4c}.fb.bad{color:#b4441f}
.dir-steps{list-style:none;margin:0;padding:0;counter-reset:s}
.dir-steps li{padding:8px 10px 8px 38px;border-radius:6px;position:relative;font-size:14.5px;counter-increment:s}
.dir-steps li::before{content:counter(s);position:absolute;left:8px;top:8px;width:22px;height:22px;border-radius:50%;background:#e6e9ef;font:900 12px/22px Lato,Arial,sans-serif;text-align:center}
.dir-steps li.on{background:#fff7cc}.dir-steps li.on::before{background:#ffe066}
.dir-steps li.dn::before{background:#0f2747;color:#fff}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:10px}
.opt{border:1px solid #c9d1dc;background:#fff;border-radius:8px;padding:9px 12px;text-align:left;font:14.5px Lato,Arial,sans-serif;color:#1d2735}
.opt.sel{border-color:#0f2747;box-shadow:inset 0 0 0 1px #0f2747}
.opt.right{border-color:#1f8a4c;background:#eaf7ef}.opt.wrong{border-color:#c0392b;background:#fdeceb}
.typ-box{font:22px/1.7 "JetBrains Mono",monospace;background:#fff;border:1px solid #e1e6ee;border-radius:10px;padding:18px 20px;cursor:text;position:relative;letter-spacing:.01em}
.typ-box span.ok{color:#1f8a4c}.typ-box span.bad{color:#c0392b;background:#fdeceb;border-radius:2px}
.typ-box span.cur{box-shadow:inset 2px 0 #0f2747;animation:cblink 1s steps(1) infinite}
@keyframes cblink{50%{box-shadow:none}}
.typ-box input{position:absolute;opacity:0;pointer-events:none;width:1px;height:1px}
.typ-stats{display:flex;gap:28px;margin:16px 0;font-size:14px;color:#4b5b73}
.typ-stats b{display:block;font:900 30px/1 Lato,Arial,sans-serif;color:#0f2747}
.star{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.star label{display:flex;flex-direction:column;gap:5px;font:900 14px Lato,Arial,sans-serif}
.star label span{font-weight:400;color:#64748b;font-size:12.5px}
.star textarea{border:1px solid #c9d1dc;border-radius:8px;padding:8px 10px;font:14.5px/1.5 Lato,Arial,sans-serif;min-height:96px;resize:vertical}
.chk{list-style:none;padding:0;margin:0;font-size:14px}
.chk li{padding:5px 0 5px 26px;position:relative}
.chk li::before{content:"";position:absolute;left:0;top:7px;width:16px;height:16px;border-radius:50%;border:2px solid #c9d1dc}
.chk li.y::before{background:#1f8a4c;border-color:#1f8a4c}
.mcq{display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:20px}
.mcq-q{background:#fff;border:1px solid #e1e6ee;border-radius:10px;padding:18px 20px}
.mcq-q h4{margin:0 0 4px;font:900 13px Lato,Arial,sans-serif;color:#64748b}
.mcq-q p{font-size:17px;margin:0 0 12px}
.mcq-o{display:grid;gap:8px}
.mcq-nav{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.pal{background:#fff;border:1px solid #e1e6ee;border-radius:10px;padding:14px}
.pal-g{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:8px 0 12px}
.pal-g button{height:34px;border-radius:6px;border:1px solid #c9d1dc;background:#fff;font:900 13px Lato,Arial,sans-serif}
.pal-g button.a{background:#1f8a4c;border-color:#1f8a4c;color:#fff}
.pal-g button.m{background:#7c3aed;border-color:#7c3aed;color:#fff}
.pal-g button.cur{outline:2px solid #0f2747;outline-offset:1px}
.pal small{display:block;font-size:12px;color:#64748b;line-height:1.7}
.res-i{background:#fff;border:1px solid #e1e6ee;border-radius:10px;padding:12px 16px;margin-bottom:8px;font-size:14.5px}

.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);transform:translate(-50%,20px);background:#0f2747;color:#fff;padding:10px 16px;border-radius:10px;font-size:14.5px;z-index:200;opacity:0;pointer-events:none;transition:.25s;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* 08-responsive.css: Breakpoints at 1100px, 860px and 640px. */
/* responsive */
@media (max-width:1100px){
 .a-dash{grid-template-columns:1fr}.a-aside .wm{display:none}
 .a-course{grid-template-columns:150px minmax(0,1fr)}.a-course .a-side{display:none}
 .gal{grid-template-columns:repeat(2,minmax(0,1fr))}.labs{grid-template-columns:repeat(3,minmax(0,1fr))}
 .ij-tree,.vs-side{display:none}.jp-dbg{width:200px}
}
@media (max-width:860px){
 .hero{grid-template-columns:1fr;gap:16px}
 .sec-h{grid-template-columns:1fr}
 .lg-row{grid-template-columns:1fr}.lg-name{border-right:0;border-bottom:1px solid var(--rule)}
 .phases{grid-template-columns:1fr}.ph{border-left:0;border-top:1px solid var(--rule)}.ph:first-child{border-top:0}
 .ex-grid,.ag-grid,.arch,.dec,.can{grid-template-columns:1fr}
 .steps3{grid-template-columns:1fr}.steps3>div{border-left:0;border-top:1px solid var(--rule)}.steps3>div:first-child{border-top:0}
 .phone{margin:0 auto}
 .a-cal{grid-template-columns:1fr}.a-inbox{grid-template-columns:1fr;height:auto}.ib-list{max-height:260px;border-right:0;border-bottom:1px solid #c7cdd1}
 .a-course{grid-template-columns:1fr}.a-cnav{flex-direction:row;overflow-x:auto;gap:4px}.a-cnav button{border-left:0;border-bottom:3px solid transparent;white-space:nowrap}.a-cnav button.on{border-bottom-color:#2d3b45}
 .ex-body{grid-template-columns:1fr;grid-template-rows:minmax(0,36%) minmax(0,1fr)}.ex-l{border-right:0;border-bottom:1px solid #dde3ea}.ex-top{gap:8px 12px;padding:8px 12px}.ex-top small{display:none}.ex-pc{font-size:11.5px;gap:8px}
 .lab-2,.mcq,.star{grid-template-columns:1fr}
 .ij-tb{grid-template-columns:1fr}.ij-vars{display:none}
 .vs-prev{width:46%}.jp-dbg{display:none}.wb-nav{display:none}
 .mg-body{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) minmax(0,1fr)}
 .a-login{grid-template-columns:1fr}.lg-art{display:none}
 .wt-note{font-size:14px}
}
@media (max-width:640px){
 .app{height:680px}
 .a-rail{width:62px}.a-nav{font-size:10.5px}.a-nav svg{width:22px;height:22px}.a-tray{left:62px}
 .a-page{padding:18px 16px 70px}.a-h1{font-size:28px}
 .gal,.labs{grid-template-columns:1fr}
 .cal-d{min-height:64px}.ev span{display:none}.ev{padding:2px;justify-content:center}.ev .ty{font-size:9px}
 .a-search{min-width:0;width:100%;margin-left:0}
 .modal{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
 .mc{height:100%;border-radius:0}
 .ij-strip,.vs-act{display:none}.ij-tool,.vs-panel{height:150px}
 .vs-split{flex-direction:column}.vs-prev{width:100%;height:45%;border-left:0;border-top:1px solid #2b2b2b}
 .wt-dock{flex-wrap:wrap;gap:8px}.wt-info{order:-1;flex-basis:100%}.wt-dock select{margin-left:auto}
 .ed-note{display:none!important}
 .mc-head .ttl span{display:none}
 .jp-menu{display:none}.jp-cell{grid-template-columns:44px minmax(0,1fr)}.jp-pr,.jp-op{font-size:11px}
 .opts{grid-template-columns:1fr}
}

/* 09-overrides.css: Small fixes layered on top: filled icons, editor min-width, exam-mode panels, mobile toolbars. */
/* additions */
svg.f{fill:currentColor!important;stroke:none!important}
.app .ic svg,.a-cicons svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;display:block}
.a-item .ic{width:22px;color:#6b7780;display:grid;flex:none}
.a-item .st svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.a-mod.locked .a-item .st{border-color:transparent;color:#9aa4ac}
.a-lesson h3{font:700 18px Lato,Arial,sans-serif;margin:24px 0 8px}
.a-btn:disabled{opacity:.5;cursor:not-allowed}
.a-launch .a-play{margin-left:0}
.ib-compose label{display:grid;gap:4px;font-size:14px;font-weight:700}
.typ-box{white-space:pre-wrap}
.lab-c .opts{margin-bottom:4px}
.co{cursor:pointer}.co.soon{cursor:default}
.ed,.ed-scroll{min-width:0}
.jp-in .ed{flex:1}
.jp-in{overflow:visible}
.ed-auto .ed-scroll{overflow:visible}
.jp-cell.on{position:relative;z-index:2}
.ide.exam .jp-dbg,.ide.exam .ij-vars{display:none}
.ide.exam .ij-tb{grid-template-columns:1fr}
.ex-l{position:relative}
@media (max-width:640px){.jp-tool{overflow-x:auto;scrollbar-width:none}.jp-tool button{flex:none;white-space:nowrap}.jp-tool span,.jp-ck{display:none}}

/* 10-lessons.css: Lesson pages: reading blocks, key-term flip cards, visual walkthrough, quick checks, worked examples, inline labs. */
/* lessons */
.th-lesson{--bg:#f7f9fc;--fg:#1d2735;--k:#7c3aed;--s:#0a7f3f;--n:#b35900;--c:#7b8799;--f:#1f5fae;--t:#0f766e;--pp:#7c3aed}
.ls{max-width:860px}
.ls-k{margin:0;color:#6b7780;font-size:14px}
.ls h1{font:400 32px/1.15 Lato,Arial,sans-serif;margin:2px 0 4px}
.ls-m{margin:0 0 16px;color:#6b7780;font-size:14px}
.ls-steps{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.ls-steps button{display:flex;align-items:center;gap:8px;border:1px solid #d7dde2;background:#fff;border-radius:999px;padding:5px 14px 5px 5px;font:14px Lato,Arial,sans-serif;color:#2d3b45}
.ls-steps b{width:24px;height:24px;border-radius:50%;background:#0f2747;color:#fff;display:grid;place-items:center;font-size:12px}
.ls-sec{padding:20px 0 6px;border-bottom:1px solid #e6e9ec}
.ls-sec h2{font:900 21px Lato,Arial,sans-serif;margin:0 0 10px}
.ls-sec>p{max-width:70ch;font-size:16px;line-height:1.65;margin:0 0 12px}
.ls-sub{color:#4b5b73;font-size:15px!important}
.ls-pts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:16px 0}
.ls-pts div{background:#eef4fb;border-radius:8px;padding:12px 14px;font-size:14.5px;line-height:1.45;border-top:3px solid #1f5fae}
.ls-warn{display:flex;gap:12px;background:#fff7e0;border:1px solid #f3dc8f;border-radius:8px;padding:12px 14px;font-size:14.5px;line-height:1.5}
.ls-warn b{flex:none;color:#7a5a00}
.ls-h3{font:700 15px Lato,Arial,sans-serif;margin:18px 0 8px;color:#4b5b73}
.ls-terms{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:12px}
.term{border:1px solid #d7dde2;background:#fff;border-radius:10px;min-height:96px;padding:12px 14px;text-align:left;display:flex;flex-direction:column;gap:4px;color:#2d3b45;transition:background .2s}
.term b{font-size:16px}.term span{display:none;font-size:14px;line-height:1.45}.term small{color:#8a949c;font-size:12px;margin-top:auto}
.term.flipped{background:#0f2747;color:#fff;border-color:#0f2747}.term.flipped span{display:block}.term.flipped small{display:none}.term.flipped b{font-size:13px;opacity:.75}
.vw{border:1px solid #d7dde2;border-radius:12px;overflow:hidden;background:#fff}
.vw-h{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid #e6e9ec;flex-wrap:wrap}
.vw-h b{font-size:15px}
.vw-c{margin-left:auto;font-size:13px;color:#6b7780}
.vw-tabs{display:flex;gap:2px;background:#eef1f5;border-radius:8px;padding:2px}
.vw-tabs button{border:0;background:none;border-radius:6px;padding:3px 10px;font:700 13px Lato,Arial,sans-serif;color:#4b5b73}
.vw-tabs button.on{background:#fff;color:#0f2747;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.vw-b{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);min-height:270px}
.vw-code{background:var(--bg);color:var(--fg);font:13px/22px "JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;padding:10px 0;overflow:auto;max-height:340px;border-right:1px solid #e6e9ec}
.vl{display:flex;white-space:pre;padding-right:14px;transition:background .15s}

  concept:'main() calls average(), which gets its own stack frame with its own variables, then returns a value.',
  prefix:'/usr/lib/jvm/jdk-21/bin/java -cp out Main\n',
  code:R`import java.util.ArrayList;
import java.util.List;

public class Main {
    static double average(List<Integer> marks) {
        int sum = 0;
        for (int m : marks) {
            sum += m;
        }
        return (double) sum / marks.size();
    }

    public static void main(String[] args) {
        List<Integer> marks = new ArrayList<>();
        marks.add(82);
        marks.add(67);
        marks.add(91);
        double avg = average(marks);
        System.out.println("Average: " + avg);
        System.out.println(avg >= 75 ? "Status: PASS" : "Status: REVIEW");
    }
}`,

    {l:15,to:17,v:{args:'String[0]',marks:'[82, 67, 91]'},n:'add() appends each mark to the end of the list.'},
    {l:18,v:{marks:'[82, 67, 91]'},n:'Calling average() pushes a new frame onto the call stack.'},
    {l:6,fn:'average',v:{marks:'[82, 67, 91]',sum:0},n:'Inside average(): sum starts at 0.'},

    {l:10,fn:'average',v:{sum:240,'marks.size()':3,'return':'80.0'},n:'Cast to double first, or integer division would drop the decimals.'},
    {l:18,v:{marks:'[82, 67, 91]',avg:'80.0'},n:'Back in main(): the frame for average() is gone and avg = 80.0.'},
    {l:19,v:{avg:'80.0'},o:'Average: 80.0\n',n:'+ joins the text and the number into one string.'},

WALKS.c = {ide:'vs', lang:'c', langName:'C', file:'main.c', project:'c-lab', title:'Pointers and swap', cmd:'gcc main.c -o main && ./main',
  concept:'Passing an address lets a function change the caller\'s variables.',
  code:R`#include <stdio.h>

void swap(int *a, int *b) {
    int temp = *a;
    *a = *b;
    *b = temp;
}

int main(void) {
    int x = 5, y = 9;
    printf("Before: x=%d y=%d\n", x, y);
    swap(&x, &y);
    printf("After:  x=%d y=%d\n", x, y);
    return 0;
}`,
  steps:[
    {l:9,n:'Every C program starts in main().'},
    {l:10,v:{x:5,y:9,'&x':'0x7ffc…a4c','&y':'0x7ffc…a48'},n:'x and y live in main\'s stack frame, each at its own address.'},
    {l:11,v:{x:5,y:9},o:'Before: x=5 y=9\n',n:'%d is a placeholder that printf fills with an int.'},
    {l:12,v:{x:5,y:9},n:'Pass the addresses (&x, &y), not copies of the values.'},
    {l:4,fn:'swap',v:{a:'0x7ffc…a4c',b:'0x7ffc…a48','*a':5,'*b':9,temp:5},n:'*a dereferences the pointer, so temp gets 5.'},
    {l:5,fn:'swap',v:{a:'0x7ffc…a4c',b:'0x7ffc…a48','*a':9,'*b':9,temp:5},n:'Writing through a changes x itself: x is now 9.'},
    {l:6,fn:'swap',v:{a:'0x7ffc…a4c',b:'0x7ffc…a48','*a':9,'*b':5,temp:5},n:'Writing through b sets y to 5.'},
    {l:13,v:{x:9,y:5},o:'After:  x=9 y=5\n',n:'Back in main(): the originals changed because we passed pointers.'},
    {l:14,v:{x:9,y:5},n:'return 0 tells the operating system the program succeeded.'},
  ]};

/* ide/runtimes.js: In-browser runtimes for the prototype only: Skulpt (Python), Function() (JavaScript), AlaSQL (SQL). In production every graded run goes to OneCompiler through the server (server/src/runner). */
/* ===================== runtimes ===================== */
function loadScript(src){ return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.async = true; s.onload = res; s.onerror = () => rej(new Error('load')); document.head.appendChild(s); }); }
const withTimeout = (p, ms) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), ms))]);
let skP = null, alP = null;
const SK = 'https://cdn.jsdelivr.net/npm/skulpt@1.2.0/dist/';
const loadSkulpt = () => skP || (skP = loadScript(SK + 'skulpt.min.js').then(() => loadScript(SK + 'skulpt-stdlib.js')).catch(e => { skP = null; throw e; }));
const loadAlasql = () => alP || (alP = loadScript('https://cdn.jsdelivr.net/npm/alasql@4.19.1/dist/alasql.min.js').catch(e => { alP = null; throw e; }));
const isCSP = m => /unsafe-eval|Content Security|EvalError|Refused to evaluate/i.test(m);
async function runPython(code){
  try { await withTimeout(loadSkulpt(), 15000); } catch (e) { return {fail:true}; }
  let out = '';
  try {
    Sk.configure({output: t => { out += t; }, read: f => { if (!Sk.builtinFiles || !Sk.builtinFiles.files[f]) throw 'File not found: ' + f; return Sk.builtinFiles.files[f]; }, __future__: Sk.python3, execLimit: 5000, yieldLimit: 100});
    await Sk.misceval.asyncToPromise(() => Sk.importMainWithBody('<stdin>', false, code, true));
    return {out};
  } catch (e) {
    const msg = String(e && e.toString ? e.toString() : e);
    if (isCSP(msg)) return {fail:true};
    return {out, err: msg};
  }
}
function runJS(code){
  const logs = [];
  const fmt = a => typeof a === 'string' ? a : (() => { try { return JSON.stringify(a); } catch (e) { return String(a); } })();
  const push = (...a) => logs.push(a.map(fmt).join(' '));
  const con = {log:push, error:push, warn:push, info:push};
  try { new Function('console', '"use strict";\n' + code)(con); }
  catch (e) { if (e instanceof EvalError || isCSP(e.message)) return {fail:true}; logs.push('Uncaught ' + e.name + ': ' + e.message); }
  return {out: logs.length ? logs.join('\n') + '\n' : ''};
}
async function runSQL(code, setup){
  try { await withTimeout(loadAlasql(), 15000); } catch (e) { return {fail:true}; }
  let db; try { db = new alasql.Database(); } catch (e) { return {fail:true}; }
  const acts = []; let grid = null, csp = false;
  const run = (sql, log) => {
    for (const st of sql.replace(/--[^\n]*/g, '').split(';').map(s => s.trim()).filter(Boolean)) {
      const t0 = performance.now();
      try {
        const r = db.exec(st); const d = ((performance.now() - t0) / 1000).toFixed(3) + ' sec';
        if (Array.isArray(r)) { grid = r; if (log) acts.push({ok:1, a:st, m:r.length + ' row(s) returned', d}); }
        else if (log) acts.push({ok:1, a:st, m:(/^create/i.test(st) ? 0 : (typeof r === 'number' ? r : 0)) + ' row(s) affected', d});
      } catch (e) { if (isCSP(e.message)) { csp = true; return false; } acts.push({ok:0, a:st, m:'Error: ' + e.message, d:'—'}); grid = null; return false; }
    }
    return true;
  };
  if (setup) run(setup, false);
  if (!csp) run(code, true);
  return csp ? {fail:true} : {acts, grid};
}
function recorded(doc, code, kind){
  const same = code === doc.code;
  const n = kind === 'exam'
    ? 'This prototype does not compile ' + (doc.langName || '') + '. In OTP Slate, Run sends this code to OneCompiler and its real output appears here.\n'
    : same ? '' : 'Showing the recorded run. In OTP Slate your edited code is sent to OneCompiler and the real output appears here.\n';
  return {note:n, out: kind === 'exam' ? '' : (doc.out || '')};
}

/* ide/player.js: Modal manager and the solution-replay player (Walker) that drives an IDE skin step by step. */
/* ===================== modal + walkthrough player ===================== */
const MODAL = {
  el: $('#modal'), mc: $('#mc'), cleanup: null, walker: null, last: null,
  open(html){
    if (this.cleanup) { this.cleanup(); this.cleanup = null; }
    this.walker = null;
    if (!this.el.classList.contains('open')) this.last = document.activeElement;
    this.mc.innerHTML = html; this.el.classList.add('open'); document.body.style.overflow = 'hidden';
    setTimeout(() => { const x = $('.mc-x', this.mc); x && x.focus({preventScroll:true}); }, 30);
  },
  close(){
    if (this.cleanup) { this.cleanup(); this.cleanup = null; }
    this.walker = null; this.el.classList.remove('open'); this.mc.innerHTML = ''; document.body.style.overflow = '';
    if (this.last && this.last.focus) this.last.focus({preventScroll:true});
  },
};
MODAL.el.addEventListener('click', e => { if (e.target === MODAL.el || e.target.closest('.mc-x')) MODAL.close(); });
document.addEventListener('keydown', e => {
  if (!MODAL.el.classList.contains('open')) return;
  if (e.key === 'Escape') { MODAL.close(); return; }
  const tag = (e.target.tagName || '').toLowerCase();
  if (!MODAL.walker || tag === 'textarea' || tag === 'input' || tag === 'select') return;
  if (e.key === 'ArrowRight') { e.preventDefault(); MODAL.walker.step(); }
  if (e.key === 'ArrowLeft') { e.preventDefault(); MODAL.walker.prev(); }
});
const DOCK = `<div class="wt-dock"><div class="wt-bar"><i></i></div><div class="wt-ctl"><button data-w="reset" aria-label="Back to start">${IC.reset}</button><button data-w="prev" aria-label="Previous step">${IC.prev}</button><button data-w="play" class="pp" aria-label="Play">${IC.play}</button><button data-w="step" aria-label="Next step">${IC.next}</button></div><div class="wt-info"><div class="wt-step"></div><div class="wt-note"></div></div><select aria-label="Playback speed"><option value="2600">0.5×</option><option value="1700" selected>1×</option><option value="950">2×</option></select><button class="wt-run" data-w="run">${IC.play} Run</button></div>`;
function Walker(steps, ide, dock, W){
  let i = -1, t = null;
  const stepEl = $('.wt-step', dock), noteEl = $('.wt-note', dock), bar = $('.wt-bar i', dock), pp = $('[data-w="play"]', dock), sp = $('select', dock);
  const intro = (W.concept ? W.concept + ' ' : '') + 'Press play, or step with the arrow keys.';
  const ui = () => { stepEl.textContent = i < 0 ? `Playable walkthrough, ${steps.length} steps` : `Step ${i + 1} of ${steps.length}`; noteEl.textContent = i < 0 ? intro : steps[i].n; bar.style.width = ((i + 1) / steps.length * 100) + '%'; pp.innerHTML = t ? IC.pause : IC.play; pp.setAttribute('aria-label', t ? 'Pause' : 'Play'); };
  const show = () => { ide.apply(i); ui(); };
  const halt = () => { if (t) { clearInterval(t); t = null; } };
  const next = () => { if (i < steps.length - 1) { i++; show(); } if (i >= steps.length - 1 && t) { halt(); ui(); } };
  const api = {
    step(){ halt(); next(); ui(); },
    prev(){ halt(); if (i > -1) { i--; show(); } else ui(); },
    play(){ if (t) { halt(); ui(); return; } if (i >= steps.length - 1) i = -1; t = setInterval(next, +sp.value); next(); ui(); },
    reset(){ halt(); i = -1; show(); },
    run(){ ide.run(); },
    detach(){ halt(); i = -1; ui(); },
    stop: halt,
  };
  sp.onchange = () => { if (t) { clearInterval(t); t = setInterval(next, +sp.value); } };
  dock.onclick = e => { const b = e.target.closest('[data-w]'); if (b) api[b.dataset.w](); };
  show();
  return api;
}

function vCal(){
  const y = S.calY, m = S.calM, all = eventsFor(y, m), ev = all.filter(e => S.calF[e.type]);
  const first = new Date(y, m, 1).getDay(), days = new Date(y, m + 1, 0).getDate(), prevDays = new Date(y, m, 0).getDate();
  const n = Math.ceil((first + days) / 7) * 7;
  const evBtn = e => `<button class="ev ${e.type}" style="border-left-color:${CO[e.cid].color}" data-act="ev" data-id="${e.id}" title="${esc(e.title)}, ${e.time}"><span class="ty">${TYPE_LBL[e.type]}</span><span>${esc(e.title)}</span></button>`;
  let grid = DOW.map(d => `<div class="cal-dow">${d}</div>`).join('');
  for (let i = 0; i < n; i++) {
    const dn = i - first + 1, out = dn < 1 || dn > days, num = dn < 1 ? prevDays + dn : dn > days ? dn - days : dn;
    const today = !out && y === TODAY.y && m === TODAY.m && dn === TODAY.d;
    const de = out ? [] : ev.filter(e => e.day === dn);
    grid += `<div class="cal-d${out ? ' out' : ''}${today ? ' today' : ''}"><span class="n">${num}</span>${de.slice(0, 3).map(evBtn).join('')}${de.length > 3 ? `<div class="cal-more">+${de.length - 3} more</div>` : ''}</div>`;
  }
  const agenda = () => { const byDay = {}; ev.forEach(e => (byDay[e.day] = byDay[e.day] || []).push(e)); const ks = Object.keys(byDay).map(Number).sort((a, b) => a - b); return ks.length ? `<div class="ag">${ks.map(d => `<div class="ag-d">${fmtDate(new Date(y, m, d))}</div>${byDay[d].map(e => `<button class="ag-e" data-act="ev" data-id="${e.id}"><span class="tm">${e.time}</span><i class="dot" style="background:${CO[e.cid].color};margin:0"></i><span><b>${esc(e.title)}</b><br><small style="color:#6b7780">${TYPE_LBL[e.type]}, ${esc(CO[e.cid].name)}</small></span></button>`).join('')}`).join('')}</div>` : '<p style="color:#6b7780">Nothing this month with these filters.</p>'; };
  const sel = all.find(e => e.id === S.calSel);
  const detail = sel ? `<div class="evd"><b>${esc(sel.title)}</b>${TYPE_LBL[sel.type]}, ${esc(CO[sel.cid].name)}<br>${fmtDate(new Date(y, m, sel.day))} at ${sel.time}<p style="display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 0"><button class="a-btn" data-act="course" data-id="${sel.cid}">Open course</button><button class="a-btn" data-act="remind">Remind me on WhatsApp</button></p></div>` : '';
  return `<div class="a-page"><div class="a-head"><h1 class="a-h1">Calendar</h1></div><div class="a-cal"><div>
   <div class="cal-h"><button class="a-btn" data-act="cal" data-d="today">Today</button><button class="a-btn" data-act="cal" data-d="-1" aria-label="Previous month">‹</button><button class="a-btn" data-act="cal" data-d="1" aria-label="Next month">›</button><h2>${MONTHS[m]} ${y}</h2><span class="sp"></span><button class="a-pill${S.calView === 'month' ? ' on' : ''}" data-act="calv" data-v="month">Month</button><button class="a-pill${S.calView === 'agenda' ? ' on' : ''}" data-act="calv" data-v="agenda">Agenda</button></div>
   ${S.calView === 'month' ? `<div class="cal-grid">${grid}</div>` : agenda()}</div>
   <aside><div class="cal-key"><b style="font-size:15px">Show</b>${Object.keys(TYPE_LBL).map(t => `<label><input type="checkbox" data-act="calf" data-t="${t}" ${S.calF[t] ? 'checked' : ''}><i style="background:${TCOL[t]}"></i>${{class:'Classes', deadline:'Deadlines', exam:'Exams', project:'Project submissions'}[t]}</label>`).join('')}<b style="font-size:15px;margin-top:10px">Calendars</b>${ENROLLED.map(id => `<label><i style="background:${CO[id].color};border-radius:50%"></i>${esc(CO[id].name)}</label>`).join('')}</div>${detail}</aside></div></div>`;
}

function Chat(root, opts = {}){
  const body = $('.ch-body', root), chips = $('.ch-chips', root);
  let role = opts.role || 'student', busy = false, gen = 0, clock = 14;
  const now = () => `9:${String(clock++ % 60).padStart(2, '0')} AM`;
  function add(html, me, sys){ const b = document.createElement('div'); b.className = 'bub' + (me ? ' me' : '') + (sys ? ' sys' : ''); b.innerHTML = html + (sys ? '' : `<span class="tm">${now()}${me ? ' <span class="tk">✓✓</span>' : ''}</span>`); body.append(b); body.scrollTop = body.scrollHeight; return b; }
  async function say(list, g){ for (const h of list) { const t = document.createElement('div'); t.className = 'typing'; t.innerHTML = '<i></i><i></i><i></i>'; body.append(t); body.scrollTop = body.scrollHeight; await wait(600 + Math.min(800, h.length * 2)); t.remove(); if (g !== gen) return; add(h); } }
  function trace(rows){ const tl = opts.trace; if (!tl) return; const e = tl.querySelector('.empty'); if (e) e.remove(); rows.forEach(([m, p, r]) => { const d = document.createElement('div'); d.innerHTML = `<span class="m">${m}</span><span>${esc(p)}</span><span class="ok">${esc(r)}</span>`; tl.append(d); }); tl.scrollTop = tl.scrollHeight; }
  const setChips = dis => $$('.chip', chips).forEach(c => { c.disabled = dis; });
  async function run(R){ if (busy) return; busy = true; setChips(true); const g = gen; add(esc(R.u), true); await wait(350); if (g !== gen) return; trace(R.tools); await say(R.a, g); if (g !== gen) return; busy = false; setChips(false); }
  chips.addEventListener('click', e => { const c = e.target.closest('.chip'); if (c) run(SCRIPT[role][c.dataset.k]); });
  body.addEventListener('click', e => { const b = e.target.closest('[data-wa]'); if (!b || busy) return; b.parentElement.querySelectorAll('button').forEach(x => { x.disabled = true; }); run(ACTIONS[b.dataset.wa]); });
  function reset(r){ gen++; busy = false; role = r; clock = 14; body.innerHTML = ''; chips.innerHTML = AG[r].chips.map(([k, l]) => `<button class="chip" data-k="${k}">${esc(l)}</button>`).join(''); if (opts.trace) opts.trace.innerHTML = '<div class="empty">Tap a suggestion in the phone. Each request Otto sends to the OTP Slate API shows up here.</div>'; add('Today', false, true); AG[r].intro.forEach(h => add(h)); }
  reset(role);
  return {reset};
}

/* ===================== sign-in ===================== */
const LOGIN = $('#login'), LGF = $('#lgForm'), LGT = $('#lgToast');
const SESSION_KEY = 'otp-slate-demo-session';
let signedIn = false, loginNumber = '', loginStage = 1;
try { signedIn = sessionStorage.getItem(SESSION_KEY) === 'active'; } catch (_) {}
function lockShell(locked) {
  [...APP.children].filter(el => el !== LOGIN).forEach(el => { el.inert = locked; el.setAttribute('aria-hidden', String(locked)); });
}
function showLogin(){
  closeTray(); togglePet(false); MODAL.close();
  LOGIN.classList.add('open'); lockShell(true); lgStep(1);
}
function signOut(){
  signedIn = false;
  try { sessionStorage.removeItem(SESSION_KEY); } catch (_) {}
  S.view = 'dashboard'; S.q = ''; S.cat = 'tracks';
  showLogin();
}
function loginError(message) { $('#loginError').textContent = message; }
function lgStep(n){
  if (n === 2) {
    loginNumber = ($('#lgNum')?.value || loginNumber).replace(/\D/g, '');
    if (!/^[6-9]\d{9}$/.test(loginNumber)) { loginError('Enter a valid 10-digit Indian mobile number.'); $('#lgNum').focus(); return; }
    const student=studentAdminData.students.find(s=>s.phone===loginNumber);
    if(!student || student.status!=='Active' || studentAdminData.orgs.find(o=>o.id===student.org)?.status!=='Active'){loginError('No active student account is assigned to this number. Contact Platform Admin.');return;}
    studentIdentity=student.id;
  }
  if (n === 3) {
    const code = $('#lgCode')?.value.trim();
    if (code !== '482917') { loginError('That code does not match. Use the demo code 482917.'); $('#lgCode').focus(); return; }
    signedIn = true;
    try { sessionStorage.setItem(SESSION_KEY, 'active'); sessionStorage.setItem('otp-slate-student-id',studentIdentity); } catch (_) {}
    LOGIN.classList.remove('open'); lockShell(false); go('dashboard');
    $('.a-nav[data-nav="dashboard"]').focus(); return;
  }
  loginStage = n;
  LGT.classList.remove('show');
  LGF.innerHTML = `<span class="hub-eyebrow">OTP SLATE · STUDENT PORTAL</span><h3>${n === 1 ? 'Welcome back.' : 'Enter your demo code'}</h3><p style="margin:0;color:#4b5b73">${n === 1 ? 'Your next step starts here. Sign in to learn, practise and prepare for your career.' : 'Continue with +91 ' + esc(loginNumber.slice(0,2) + '••••' + loginNumber.slice(-4)) + '.'}</p>
    <div class="login-demo"><b>UI preview</b><br>This is a demo sign-in. No WhatsApp message is sent. Use your admin-registered number (demo: 9876540210) and code <b>482917</b>.</div>
    <form id="loginForm" novalidate>
    ${n === 1 ? `<label for="lgNum">Mobile number</label><div class="lg-ph"><span>+91</span><input id="lgNum" type="tel" inputmode="tel" autocomplete="tel-national" maxlength="14" placeholder="98765 40210" value="${esc(loginNumber)}" aria-describedby="loginError"></div>` : `<label for="lgCode">Six-digit demo code</label><input class="login-code" id="lgCode" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="482917" aria-describedby="loginError">`}
    <p id="loginError" role="alert" style="color:#b4441f;min-height:22px;margin:8px 0"></p><button class="lg-btn" type="submit">${n === 1 ? 'Continue' : 'Sign in'}</button></form>
    ${n === 2 ? '<button class="a-btn" data-lg="back" style="justify-content:center">Use a different number</button>' : '<small style="color:#6b7780">Demo access stays active in this browser tab until you log out.</small>'}`;
  $('#loginForm').addEventListener('submit', e => { e.preventDefault(); lgStep(loginStage === 1 ? 2 : 3); });
  (n === 1 ? $('#lgNum') : $('#lgCode')).focus();
}
LOGIN.addEventListener('click', e => { if(e.target.closest('[data-lg="back"]')) lgStep(1); });

const LESSON = {
  py:{idea:['A list keeps several values in order under one name, so you can work with all of them at once. A for loop visits each item in turn, which is how you total, filter or change a list without writing the same line five times.', 'Functions give a name to a piece of logic. Write it once, call it as often as you need, and fix it in one place.'],
    points:['Lists use square brackets and start counting at index 0.', 'for x in items: runs the indented block once per item.', 'def name(params): defines a function; return hands a value back.'],
    mistake:'Forgetting to indent the loop body. Python uses indentation, not braces, to decide what belongs inside the loop.',
    terms:[['List', 'An ordered, changeable collection, like [72, 88, 95].'], ['Loop variable', 'The name that holds the current item on each pass.'], ['Return value', 'What a function hands back to the code that called it.']]},
  java:{idea:['Every Java program is built from classes, and execution starts in main(). When main() calls another method, Java pushes a new frame onto the call stack. That frame has its own variables and disappears when the method returns.', 'Types matter: dividing two ints gives an int, so you cast to double when you need the decimals.'],
    points:['main(String[] args) is where the JVM starts.', 'Each method call gets its own stack frame.', '(double) converts a value before the arithmetic happens.'],
    mistake:'Integer division. 7 / 2 is 3 in Java, not 3.5, unless one side is a double.',
    terms:[['Stack frame', 'The memory a method call uses for its own variables.'], ['Signature', 'A method\'s name, parameters and return type.'], ['Cast', 'Converting a value to another type, like (double) sum.']]},
  c:{idea:['Every variable in C lives at a memory address. A pointer is a variable that stores one of those addresses.', 'C passes arguments by value, so a function normally works on copies. Pass a pointer instead and the function can reach back and change the original.'],
    points:['&x gives the address of x.', '*p reads or writes the value that p points to.', 'Pass pointers when a function must change the caller\'s variables.'],
    mistake:'Calling swap(x, y) instead of swap(&x, &y). The function swaps its own copies and the originals never change.',
    terms:[['Address', 'Where a variable lives in memory, like 0x7ffc…a4c.'], ['Pointer', 'A variable that stores an address.'], ['Dereference', 'Using *p to get to the value at that address.']]},
  cpp:{idea:['The Standard Template Library gives you containers and algorithms that are fast and well tested. std::vector is a growable array, and std::sort orders any range of it.', 'Range-based for loops let you read each element without managing an index yourself.'],
    points:['vector<int> v = {…} creates and fills a vector.', 'sort(v.begin(), v.end()) sorts in ascending order.', 'for (int x : v) visits every element.'],

    terms:[['Container', 'An object that holds elements, like vector or map.'], ['Iterator', 'A position in a container; begin() and end() mark the range.'], ['Range-based for', 'for (auto x : v) loops over every element.']]},
  js:{idea:['JavaScript arrays come with methods that take a function and apply it to every item. filter keeps some items, map transforms each one, and reduce folds them into a single value.', 'Chained together they read like a sentence: keep the students who passed, then take their names.'],

    mistake:'Expecting filter or map to change the original array. They return new arrays and leave the original alone.',
    terms:[['Callback', 'A function you pass to another function, like s => s.score >= 75.'], ['Arrow function', 'Short function syntax: (a, b) => a + b.'], ['Accumulator', 'The running value reduce passes from item to item.']]},
  html:{idea:['HTML gives a page its structure: headings, paragraphs, links and sections. CSS gives it a look. The browser reads the HTML from top to bottom, builds a tree of elements, then applies every CSS rule that matches.', 'A class connects the two: class="card" in the HTML, .card in the CSS.'],
    points:['Elements nest inside each other to form the DOM tree.', 'Block elements (div, p, h1) start on a new line; inline ones (span, a) do not.', 'One class can style many elements at once.'],

    terms:[['Element', 'One piece of the page, like <h1>…</h1>.'], ['Selector', 'The part of a CSS rule that picks elements, like .card.'], ['DOM', 'The tree of elements the browser builds from your HTML.']]},
  sql:{idea:['Relational databases split data into tables so each fact is stored once. To answer a question that spans tables, you JOIN them on a shared column.', 'Aggregates like AVG() and COUNT() summarise many rows. GROUP BY decides which rows get summarised together.'],
    points:['JOIN … ON pairs rows where the condition is true.', 'GROUP BY produces one result row per group.', 'WHERE filters rows before grouping; HAVING filters groups after.'],
    mistake:'Selecting a column that is neither grouped nor aggregated. Most databases reject the query or return an arbitrary value.',
    terms:[['Primary key', 'A column that uniquely identifies each row, like students.id.'], ['Foreign key', 'A column that points at another table\'s key, like scores.student_id.'], ['Aggregate', 'A function over many rows: AVG, COUNT, SUM, MIN, MAX.']]},
  mongo:{idea:['MongoDB stores documents: JSON-like objects that can differ in shape. Related data often lives inside one document instead of across several tables.', 'find() filters documents. The aggregation pipeline passes them through stages like $match and $group to reshape them.'],

  bs:{idea:['Searching a list one item at a time can take n checks. If the list is sorted, binary search does far better: check the middle, then throw away the half that cannot contain the target.', 'Every check halves what is left, so a million sorted items need about 20 checks.'],
    points:['Only works on sorted data.', 'Keep a window [lo, hi] and shrink it on every check.', 'Runs in O(log n) time.'],

  quant:{idea:['Most profit and loss questions are percentages applied one after another. A mark-up raises the price; a discount then lowers the marked price, not the cost.', 'Multiply the factors instead of adding percentages: a 25% mark-up and a 10% discount give 1.25 × 0.90 = 1.125, which is a 12.5% profit.'],

  typing:{idea:['Speed comes from accuracy and rhythm, not from rushing. Your fingers rest on the home row (A S D F and J K L ;) and each finger owns a column of keys.', 'Tests count a word as five characters and most deduct for errors, so a clean 35 words per minute beats a messy 50.'],
    points:['Rest your fingers on the home row.', 'Look at the screen, not the keys.', 'Slow down to stop errors; speed follows.'],
    mistake:'Looking down at the keyboard. It breaks your rhythm and doubles your errors.',

  star:{idea:['Behavioural questions ("Tell me about a time…") want evidence. The STAR method gives your answer a shape the interviewer can follow: Situation, Task, Action, Result.', 'Spend most of the answer on Action and say "I", because the interviewer is assessing you, not your team.'],

}

  return `<div class="compiler-fullscreen-container" style="height:100%;min-height:100dvh;width:100%;background:#0d1117;display:flex;flex-direction:column;position:relative;">
    <iframe src="https://onecompiler.com/embed?theme=dark" width="100%" height="100%" style="flex:1 1 auto;width:100%;height:100%;min-height:100dvh;border:none;display:block;" frameborder="0" allow="clipboard-write; clipboard-read; run-scripts; fullscreen"></iframe>
  </div>`;
}
function vHub(){
 const h=HUBS[S.view], list=COURSES.filter(c=>c.cat===S.view && studentHasCourse(c.id));
 return `<div class="a-page"><div class="a-crumbs"><button data-act="go" data-go="toolkit">Your Placement Toolkit</button><span>›</span><span>${h.name}</span></div><div class="a-head"><h1 class="a-h1">${h.name}</h1><span class="sp"></span><span class="a-tag">${list.length} ${S.view==='hiring'?'assessment types':'learning paths'}</span></div>
 <section class="hub-banner"><div><p class="hub-eyebrow">LEARN · PRACTISE · GET HIRED</p><h2>${h.intro}</h2><p>${h.desc}</p></div><span class="hub-symbol" aria-hidden="true">${h.glyph}</span></section>
 <p class="hub-note">${h.note}</p><div class="hub-grid">${list.map(c=>{const d=HUB_DETAILS[c.id]; return `<article class="hub-card"><div class="hub-card-top"><span class="a-sw" style="background:${c.color}">${esc(c.glyph)}</span><span class="a-tag">${c.mods.length} modules</span></div><h2>${esc(c.name)}</h2><p>${d[0]}</p><small>${esc(c.mods.slice(0,3).map(m=>m.name).join(' · '))}</small><div class="hub-actions"><button class="a-btn pri" data-act="launch" data-id="${c.id}" ${['hiring','crt'].includes(S.view)&&!studentHasPractice(c.id)?'disabled title="Practice not assigned by your admin"':''}>${d[1]} <span aria-hidden="true">→</span></button>${['hiring','crt'].includes(S.view)?`<button class="a-btn" data-act="course" data-id="${c.id}">View modules</button>`:''}</div></article>`;}).join('')}</div></div>`;
}
function launchActivity(id){
 if (!studentHasPractice(id)) {toast('Your admin has not assigned this practice.');return;}
 if (['aptitude','typing','live','quant','logic','interview'].includes(id)) {
   openLab(CO[id].key, {course:id, title:id==='live'?'Live assessment · sample round':CO[id].name, timed:id==='live'});
 } else if(id==='livecode') openExam({...EXAMS.live,title:'Live code test · sample round',proctor:false,strict:false});
 else if(['practice','cp'].includes(id)) openExam({title:CO[id].name + ' · sample problem',course:id,mode:'practice',langs:['py','cpp','java','c'],timer:0,proctor:false,q:'two'});
 else if(id==='webdev') openWorkspace('html',{course:id});
 else go('course',{course:id,tab:'modules'});
}
const logoutButton=document.createElement('button'); logoutButton.className='a-nav'; logoutButton.dataset.act='logout'; logoutButton.innerHTML='<span class="rail-glyph" aria-hidden="true">↪</span>Log out';
$('.a-rail').append(logoutButton);

// Local preview bridge. The production API must enforce these rules itself.
let studentAdminData;try{studentAdminData=SlateAdminModel.load();SlateAdminModel.save(studentAdminData);}catch(_){studentAdminData=SlateAdminModel.seed();}
let studentIdentity=new URLSearchParams(location.search).get('student')||sessionStorage.getItem('otp-slate-student-id')||'aarav';
const assignedStudent=()=>studentAdminData.students.find(s=>s.id===studentIdentity);
const studentGrants=()=>SlateAdminModel.effective(studentAdminData,assignedStudent());
const studentHasCourse=id=>Object.hasOwn(studentGrants().courses,id);
const studentHasModule=(id,mi)=>SlateAdminModel.canModule(studentGrants(),id,mi);
const studentHasPractice=id=>studentGrants().practices.includes(id);
function studentCourseList(){return COURSES.filter(c=>studentHasCourse(c.id)).map(c=>c.id);}
function studentCanView(view){
 const s=assignedStudent();if(!s||s.status!=='Active'||studentAdminData.orgs.find(o=>o.id===s.org)?.status!=='Active')return false;
 if(['course','lesson'].includes(view))return studentHasCourse(S.course)&&(view!=='lesson'||studentHasModule(S.course,S.mod));
 if(['jobs','resume'].includes(view))return studentGrants().features.includes(view);
 if(['hiring','crt','dsa','fullstack','cc'].includes(view))return COURSES.some(c=>c.cat===view&&studentHasCourse(c.id));
 return true;
}
function assignedHubEntries(){return Object.entries(HUBS).filter(([id])=>COURSES.some(c=>c.cat===id&&studentHasCourse(c.id)));}
function accessEmpty(){return `<div class="a-page"><div class="a-head"><h1 class="a-h1">Access not assigned</h1></div><section class="exam-empty"><h2>Your admin manages your learning access.</h2><p>This resource is not assigned to your account. Contact Platform Admin to request learning access.</p><button class="a-btn" data-act="go" data-go="dashboard">Back to dashboard</button></section></div>`;}
function studentPublishedExams(){const s=assignedStudent();if(!s||s.status!=='Active'||studentAdminData.orgs.find(o=>o.id===s.org)?.status!=='Active')return [];return studentAdminData.exams.filter(e=>e.org===s.org&&e.status==='Published'&&(!e.cohort||e.cohort===s.cohort)&&(!e.deadline||new Date(e.deadline)>new Date()));}
function assignedExamsHTML(){const exams=studentPublishedExams();if(!exams.length)return null;return `<div class="a-page"><div class="a-head"><h1 class="a-h1">Live Exams</h1><span class="sp"></span><span class="a-tag">${exams.length} available</span></div><p class="hub-note">Released by Platform Admin.</p><div class="hub-grid">${exams.map(e=>`<article class="hub-card"><div class="hub-card-top"><span class="live-status">Available</span><span class="a-tag">${e.kind==='coding'?'Coding':'Aptitude'}</span></div><h2>${esc(e.title)}</h2><p>${e.duration} minutes · ${e.kind==='coding'?'1 sample problem':'5 sample questions'}</p><small>${e.deadline?'Closes '+new Date(e.deadline).toLocaleString('en-IN',{timeZone:'Asia/Kolkata'})+' IST':'No closing time'}</small><div class="hub-actions"><button class="a-btn pri" data-act="admin-exam" data-id="${e.id}">Start exam →</button></div></article>`).join('')}</div></div>`;}
function startAssignedExam(id){const e=studentPublishedExams().find(e=>e.id===id);if(!e){toast('This exam is no longer available.');render();return;}if(e.kind==='coding')openExam({title:e.title,course:null,mode:'exam',langs:['py','cpp','java','c'],timer:e.duration*60,proctor:false,q:'two'});else openLab('mcq',{title:e.title,timed:true,duration:e.duration*60});}
function studentPublishedJobs(){const s=assignedStudent();return studentAdminData.jobs.filter(j=>j.org===s?.org&&j.status==='Published');}
APP.addEventListener('click',e=>{const b=e.target.closest('[data-act="admin-exam"]');if(b&&signedIn)startAssignedExam(b.dataset.id);});
window.addEventListener('storage',e=>{if(e.key===SlateAdminModel.KEY){try{studentAdminData=SlateAdminModel.load();MODAL.close();render();}catch(_){toast('Could not refresh assigned access.');}}});


// Standalone web app initialization & interaction wiring
const IDE_GROUP = {
  py: ['py', 'advpy', 'pyfs', 'py100'],
  java: ['java', 'advjava', 'javafs', 'java100'],
  c: ['c', 'cpp', 'cpp100'],
  js: ['js', 'mern'],
  html: ['html', 'webdev'],
  sql: ['sql'],
  mongo: ['mongo', 'mern']
};
$$('[data-courses]').forEach(td => {
  if (IDE_GROUP[td.dataset.courses]) {
    td.textContent = IDE_GROUP[td.dataset.courses].map(id => CO[id].name).join(', ');
  }
});

document.addEventListener('click', e => {
  const b = e.target.closest('[data-demo]');
  if (!b || !signedIn) return;
  const [k, v] = b.dataset.demo.split(':');
  if (LOGIN.classList.contains('open') && k !== 'login' && ['go', 'course', 'tray', 'pet'].includes(k)) {
    LOGIN.classList.remove('open');
  }
  if (k === 'go') {
    go(v);
  } else if (k === 'lesson') {
    S.course = v;
    S.qc = {};
    S.wk = 0;
    go('lesson', { mod: 0, item: 0 });
  } else if (k === 'course') {
    go('course', { course: v, tab: 'modules' });
  } else if (k === 'tray') {
    go('dashboard');
    openTray(v);
  } else if (k === 'login') {
    showLogin();
  } else if (k === 'pet') {
    togglePet(true);
  } else if (k === 'walk') {
    openWalk(v);
  } else if (k === 'exam') {
    openExam(EXAMS[v]);
  } else if (k === 'lab') {
    openLab(v);
  }
});


render();
if (!signedIn) showLogin();
setTimeout(() => {
  if (!$('#petChat').classList.contains('open') && !LOGIN.classList.contains('open')) {
    petSay('Python Assignment 2 is due Thursday. Tap me for the brief.');
  }
}, 2600);

</script>
</body>
</html>
