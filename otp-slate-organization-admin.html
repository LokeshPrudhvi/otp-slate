 async function passwordHash(password,salt,iterations){
  if(!global.crypto?.subtle)throw new Error('Password preview requires a browser with Web Crypto support.');

  let difference=0;for(let i=0;i<actual.length;i++)difference|=actual.charCodeAt(i)^credential.hash.charCodeAt(i);

 return `<div class="chart-key"><span>${label}</span><span>${percent?'Score / 100':'Students per day'}</span></div><svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label)} by day; use the data table below for exact values">${ticks}<path d="${path}" fill="none" stroke="${color}" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/>${data.map((d,i)=>d[key]===null?'':`<circle cx="${x(i)}" cy="${y(d[key])}" r="3" fill="white" stroke="${color}" stroke-width="2" tabindex="0"><title>${dayLabel(d.date)}: ${d[key]}${percent?'%':' students'}</title></circle>`).join('')}${labels}</svg><details class="data-details"><summary>View chart data</summary><div class="table-wrap"><table><thead><tr><th>Date</th><th>${label}</th></tr></thead><tbody>${data.map(d=>`<tr><td>${dayLabel(d.date)}</td><td>${d[key]===null?'No attempts':d[key]+(percent?'%':'')}</td></tr>`).join('')}</tbody></table></div></details>`;
}
function engagement(){const list=students(),rows=events(),active=new Set(rows.map(e=>e.student)),groups=[{label:'Active accounts, learning',count:list.filter(s=>s.status==='Active'&&active.has(s.id)).length,color:'#315f98'},{label:'Active accounts, no activity',count:list.filter(s=>s.status==='Active'&&!active.has(s.id)).length,color:'#ffe066'},{label:'Suspended accounts',count:list.filter(s=>s.status!=='Active').length,color:'#dce4ee'}];let offset=0;const segments=groups.map(g=>{const length=list.length?g.count/list.length*301.59:0;const result=`<circle cx="70" cy="70" r="48" fill="none" stroke="${g.color}" stroke-width="15" stroke-dasharray="${length} ${301.59-length}" stroke-dashoffset="${-offset}" transform="rotate(-90 70 70)"><title>${g.label}: ${g.count}</title></circle>`;offset+=length;return result;}).join('');return `<div class="donut-layout"><svg class="chart donut" viewBox="0 0 140 140" role="img" aria-label="Student participation: ${groups.map(g=>g.label+' '+g.count).join(', ')}"><circle cx="70" cy="70" r="48" fill="none" stroke="#edf1f6" stroke-width="15"/>${segments}<text class="total" x="70" y="70" text-anchor="middle">${list.length}</text><text class="label" x="70" y="88" text-anchor="middle">students</text></svg><div class="donut-legend">${groups.map(g=>`<p><i style="background:${g.color}"></i>${g.label}<b>${g.count}</b></p>`).join('')}</div></div>`;}
function skillBars(list=students(),kind){const rows=events(list,kind).filter(e=>e.score!==null);return Object.entries(skills).map(([id,name])=>{const attempts=rows.filter(e=>e.skill===id),value=avg(attempts.map(e=>e.score));return `<div class="skill-row"><div class="bar-row"><span>${name}</span><div class="bar-track" role="img" aria-label="${name}: ${value===null?'No attempts':value+'%'}"><div class="bar-fill" style="width:${value||0}%"></div></div><b>${pct(value)}</b></div><p><span>${attempts.length} attempts</span><span>${new Set(attempts.map(e=>e.student)).size} students</span></p></div>`;}).join('');}
function ranked(){return students().map(s=>({s,m:studentMetric(s)})).filter(x=>x.m.score!==null).sort((a,b)=>b.m.score-a.m.score||b.m.attempts-a.m.attempts||a.s.name.localeCompare(b.s.name));}
function leaderboard(){const list=ranked().slice(0,5);return `<section class="panel"><div class="panel-head"><div><h2>Student performance</h2><p>Ranked by average recorded assessment score</p></div><button class="btn link" data-action="nav" data-view="students">All students →</button></div><div class="table-wrap"><table><thead><tr><th>Rank</th><th>Student</th><th>Score</th><th>Attempts</th><th></th></tr></thead><tbody>${list.map(({s,m},i)=>`<tr><td><span class="rank ${i===0?'top':''}">${String(i+1).padStart(2,'0')}</span></td><td><div class="person"><div class="avatar">${initials(s.name)}</div><div><b>${esc(s.name)}</b><small>${esc(s.cohort||'Unassigned')}</small></div></div></td><td><b>${pct(m.score)}</b></td><td>${m.attempts}</td><td><button class="btn link" data-action="student" data-id="${s.id}">View →</button></td></tr>`).join('')}</tbody></table>${list.length?'':empty('No scores yet','Student rankings will appear when assessment results are available.')}</div><div class="panel-foot"><span>${dates().map((d,i,a)=>i===0||i===a.length-1?dayLabel(d):'').filter(Boolean).join(' – ')}</span><span>Students without scores are not ranked</span></div></section>`;}
function attention(){const list=students().map(s=>({s,m:studentMetric(s)})).filter(x=>!x.m.activity||x.m.level==='Needs support').slice(0,4);return list.length?list.map(({s,m})=>`<div class="attention-row"><div><b>${esc(s.name)}</b><p>${!m.activity?'No recorded activity in this period':'Average score below 60%'} · ${esc(s.cohort||'Unassigned')}</p></div><button class="btn link" data-action="student" data-id="${s.id}">View →</button></div>`).join(''):'<div class="chart-empty">No students with low scores or missing activity in this period.</div>';}
function heatmap(){const range=dates(),rows=events();const chunks=[];for(let i=0;i<range.length;i+=7)chunks.push(range.slice(i,i+7));const max=Math.max(1,students().length);return `<div class="heatmap"><span></span>${range.slice(0,7).map(d=>`<span class="day">${new Date(d+'T00:00:00Z').toLocaleDateString('en-IN',{weekday:'short',timeZone:'UTC'})}</span>`).join('')}${chunks.map((week,wi)=>`<span class="week">${dayLabel(week[0])}</span>${week.map(date=>{const n=new Set(rows.filter(e=>e.date===date).map(e=>e.student)).size;return `<div class="cell" data-level="${!n?0:n/max<.4?1:n/max<.7?2:3}" title="${dayLabel(date)}: ${n} active students">${n}</div>`;}).join('')}`).join('')}</div><p class="muted" style="margin:17px 0 0;font-size:10px">Unique active students each day · darker cells indicate more participation.</p>`;}
function vOverview(){return `<section class="hero"><div><p class="eyebrow">A CLEARER VIEW OF LEARNING</p><h2>Every learner has a story.</h2><p>Spot steady progress, understand participation and find the students who may benefit from more support.</p></div><svg class="hero-graphic" viewBox="0 0 180 110" aria-hidden="true"><rect x="2" y="8" width="175" height="96" rx="9" fill="#fff"/><path d="M18 75H164M18 51H164M18 27H164" stroke="#e6edf5"/><path d="M18 81 42 67 65 74 88 46 112 54 140 28 164 35" fill="none" stroke="#315f98" stroke-width="3" stroke-linejoin="round"/><circle cx="140" cy="28" r="7" fill="#ffe066"/></svg></section>${summary()}<div class="grid-two">${panel('Learning activity','Unique students with a recorded lesson, practice or exam',lineChart(daily(),'active','Active learners'))}${panel('Student participation','Account status and activity in the selected period',engagement())}</div><div class="grid-two grid-even">${panel('Performance by skill','Average practice and exam score out of 100',skillBars())}${panel('Assessment score trend','Daily average across recorded assessed attempts',lineChart(daily(),'score','Average score','#34876b',true))}</div><div class="grid-two">${leaderboard()}${panel('Students to follow','Activity gaps and scores to review',attention(),'<span class="badge yellow">Support signals</span>')}</div>${panel('Learning participation map','A compact view of learning activity across the period',heatmap())}`;}
function filteredStudents(){return students().map(s=>({s,m:studentMetric(s)})).filter(({s,m})=>(state.level==='all'||m.level===state.level)&&`${s.name} ${s.student_id} ${s.cohort||''}`.toLowerCase().includes(state.query.toLowerCase())).sort((a,b)=>(b.m.score??-1)-(a.m.score??-1)||a.s.name.localeCompare(b.s.name));}
function studentTable(){const list=filteredStudents(),size=20;state.page=Math.min(state.page,Math.max(0,Math.ceil(list.length/size)-1));const ranks=new Map(ranked().map((x,i)=>[x.s.id,i+1]));return `<section class="panel"><div class="table-wrap"><table><thead><tr><th>Rank</th><th>Student</th><th>Average score</th><th>Module completion</th><th>Attempts</th><th>Learning signal</th><th></th></tr></thead><tbody>${list.slice(state.page*size,(state.page+1)*size).map(({s,m})=>`<tr><td>${ranks.get(s.id)||'—'}</td><td><div class="person"><div class="avatar">${initials(s.name)}</div><div><b>${esc(s.name)}</b><small>${esc(s.student_id)} · ${esc(s.cohort||'Unassigned')}</small></div></div></td><td><b>${pct(m.score)}</b></td><td>${pct(m.progress.percent)}<div class="mini-progress"><span style="width:${m.progress.percent||0}%"></span></div></td><td>${m.attempts}</td><td>${levelBadge(m.level)}</td><td><button class="btn link" data-action="student" data-id="${s.id}">View insights →</button></td></tr>`).join('')}</tbody></table>${list.length?'':empty('No matching students','Try another search or learning signal filter.')}</div><div class="panel-foot"><span>${list.length} students · Page ${state.page+1} of ${Math.max(1,Math.ceil(list.length/size))}</span><div class="filters"><button class="btn" data-action="page" data-dir="-1" ${state.page===0?'disabled':''}>Previous</button><button class="btn" data-action="page" data-dir="1" ${(state.page+1)*size>=list.length?'disabled':''}>Next</button></div></div></section>`;}
function vStudents(){return `${summary()}<div class="search-toolbar"><input id="studentSearch" type="search" aria-label="Search students" placeholder="Search by name, student ID or cohort" value="${esc(state.query)}"><select id="signalFilter" aria-label="Learning signal"><option value="all">All learning signals</option>${['Strong progress','Developing','Needs support','Learning','No activity'].map(l=>`<option ${state.level===l?'selected':''}>${l}</option>`).join('')}</select><span class="count">Only ${esc(organization().code)} students</span></div><div id="studentTable">${studentTable()}</div>`;}
function courseMetrics(){return M.catalog.map(c=>{const members=students().filter(s=>Object.hasOwn(M.effective(db,s).courses,c.id));let total=0,done=0;members.forEach(s=>{const assigned=M.effective(db,s).courses[c.id],modules=assigned==='all'?c.mods.map((_,i)=>i):assigned,record=db.analytics.progress.find(p=>p.student===s.id&&p.course===c.id);total+=modules.length;done+=modules.filter(i=>record&&i<record.completed).length;});return {c,students:members.length,total,done,percent:total?Math.round(done/total*100):null};}).filter(c=>c.students).sort((a,b)=>b.students-a.students||a.c.name.localeCompare(b.c.name));}
function vCourses(){const list=courseMetrics();return list.length?`${summary()}<div class="grid-two grid-even">${panel('Completion by course','Completed modules as a share of currently assigned modules',list.slice(0,6).map(r=>`<div class="bar-row"><span>${esc(r.c.name)}</span><div class="bar-track"><div class="bar-fill" style="width:${r.percent||0}%"></div></div><b>${pct(r.percent)}</b></div>`).join(''))}${panel('Course reach','Number of students currently assigned to each course',list.slice(0,6).map(r=>`<div class="bar-row"><span>${esc(r.c.name)}</span><div class="bar-track"><div class="bar-fill" style="width:${r.students/Math.max(1,students().length)*100}%;background:#d8bc55"></div></div><b>${r.students}</b></div>`).join(''))}</div><section class="panel"><div class="panel-head"><div><h2>Learning pathways</h2><p>Current assignments · module completion snapshot</p></div></div><div class="table-wrap"><table><thead><tr><th>Course / pathway</th><th>Assigned students</th><th>Assigned modules</th><th>Completed modules</th><th>Completion</th></tr></thead><tbody>${list.map(r=>`<tr><td><b>${esc(r.c.name)}</b><small>${esc(r.c.code)}</small></td><td>${r.students}</td><td>${r.total}</td><td>${r.done}</td><td><b>${pct(r.percent)}</b><div class="mini-progress"><span style="width:${r.percent||0}%"></span></div></td></tr>`).join('')}</tbody></table></div></section>`:empty('No courses assigned yet','Course analytics will appear after Platform Admin assigns learning access to students in this scope.');}
function barsBySkill(kind){const rows=events(students(),kind).filter(e=>e.score!==null),counts=Object.keys(skills).map(id=>rows.filter(e=>e.skill===id).length),max=Math.max(4,...counts),W=540,H=225,L=30,B=35,T=20;return rows.length?`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Attempts by skill: ${Object.values(skills).map((s,i)=>s+' '+counts[i]).join(', ')}">${[0,1,2,3,4].map(i=>`<line class="gridline" x1="30" x2="530" y1="${H-B-i/4*(H-B-T)}" y2="${H-B-i/4*(H-B-T)}"/><text x="23" y="${H-B-i/4*(H-B-T)+3}" text-anchor="end">${Math.round(max*i/4)}</text>`).join('')}${Object.values(skills).map((name,i)=>{const x=48+i*123,height=counts[i]/max*(H-B-T);return `<rect x="${x}" y="${H-B-height}" width="65" height="${height}" rx="4" fill="${i%2?'#99b2d4':'#315f98'}"><title>${name}: ${counts[i]} attempts</title></rect><text x="${x+32}" y="${H-B-height-8}" text-anchor="middle">${counts[i]}</text><text x="${x+32}" y="${H-12}" text-anchor="middle">${name==='Logical reasoning'?'Reasoning':name==='Web development'?'Web dev':name}</text>`;}).join('')}</svg>`:'<div class="chart-empty">No assessed attempts in this period.</div>';}
function attemptTable(rows){return rows.length?`<div class="table-wrap"><table><thead><tr><th>Student</th><th>Skill</th><th>Score</th><th>Time spent</th><th>Date</th></tr></thead><tbody>${rows.sort((a,b)=>b.date.localeCompare(a.date)).slice(0,15).map(e=>{const s=roster().find(s=>s.id===e.student);return `<tr><td><button class="btn link" data-action="student" data-id="${s.id}">${esc(s.name)}</button></td><td>${skills[e.skill]}</td><td><b>${pct(e.score)}</b></td><td>${e.minutes} min</td><td>${dayLabel(e.date)}</td></tr>`;}).join('')}</tbody></table></div>`:empty('No recorded attempts','Results will appear here when students complete assessments.');}
function vPractice(){const rows=events(students(),'practice'),m=metrics();return `<div class="stats">${stat('Practice participants',new Set(rows.map(e=>e.student)).size,'Unique students this period','students')}${stat('Practice attempts',rows.length,'Recorded, assessed practice sessions','practice')}${stat('Average practice score',pct(score(students(),'practice')),'All assessed practice attempts','exams')}${stat('Practice time',Math.round(rows.reduce((a,e)=>a+e.minutes,0)/60)+' hrs','Total recorded time','overview')}</div><div class="grid-two grid-even">${panel('Practice performance','Average score by skill area',skillBars(students(),'practice'))}${panel('Practice volume','Recorded attempts by skill area',barsBySkill('practice'))}</div><section class="panel"><div class="panel-head"><div><h2>Recent practice results</h2><p>Latest 15 recorded attempts in the selected period</p></div></div>${attemptTable(rows)}</section>`;}
function distribution(){const rows=events(students(),'exam'),buckets=[{name:'Below 60%',n:rows.filter(e=>e.score<60).length,color:'#d8b75e'},{name:'60–79%',n:rows.filter(e=>e.score>=60&&e.score<80).length,color:'#91abd0'},{name:'80–100%',n:rows.filter(e=>e.score>=80).length,color:'#315f98'}];return buckets.map(b=>`<div class="bar-row"><span>${b.name}</span><div class="bar-track"><div class="bar-fill" style="width:${rows.length?b.n/rows.length*100:0}%;background:${b.color}"></div></div><b>${b.n}</b></div>`).join('')+'<p class="muted" style="font-size:10px;margin:20px 0 0">Number of recorded exam attempts in each score band.</p>';}
function vExams(){const rows=events(students(),'exam'),org=organization(),exams=db.exams.filter(e=>e.org===org.id&&(state.cohort==='all'||!e.cohort||e.cohort===state.cohort));return `<div class="stats">${stat('Exam participants',new Set(rows.map(e=>e.student)).size,'Unique students with recorded attempts','students')}${stat('Exam attempts',rows.length,'Sample assessed attempts','exams')}${stat('Average exam score',pct(score(students(),'exam')),'Recorded attempts in this period','overview')}${stat('Published exams',exams.filter(e=>e.status==='Published').length,'Released by Platform Admin','exams')}</div><div class="grid-two grid-even">${panel('Assessment score trend','Daily average of recorded exam attempts',lineChart(daily(students(),'exam'),'score','Exam score','#34876b',true))}${panel('Score distribution','Understand the spread of recorded exam results',distribution())}</div><section class="panel" style="margin-bottom:20px"><div class="panel-head"><div><h2>Organization exams</h2><p>Exam availability from Platform Admin</p></div></div>${exams.length?`<div class="table-wrap"><table><thead><tr><th>Exam</th><th>Audience</th><th>Status</th><th>Results</th></tr></thead><tbody>${exams.map(e=>`<tr><td><b>${esc(e.title)}</b><small>${e.kind==='coding'?'Coding':'Aptitude'} · ${e.duration} min</small></td><td>${esc(e.cohort||'All active students')}</td><td><span class="badge ${e.status==='Published'?'green':'gray'}">${esc(e.status)}</span></td><td>Not connected yet</td></tr>`).join('')}</tbody></table></div>`:empty('No exams published for your organization','Platform Admin will create and release exams. Recorded sample results are shown separately below.')}</section><section class="panel"><div class="panel-head"><div><h2>Sample exam results</h2><p>Illustrative attempts · separate from the exams published above</p></div><span class="badge gray">Sample data</span></div>${attemptTable(rows)}</section>`;}
function vStudent(){const s=students().find(s=>s.id===state.student);if(!s)return empty('Student is outside this view','Return to Students or adjust your cohort filter.');const m=studentMetric(s),rows=events([s]),cm=metrics([s]),grants=M.effective(db,s);return `<button class="btn link" data-action="nav" data-view="students">← Back to students</button><div class="student-hero"><div class="avatar">${initials(s.name)}</div><div><h1>${esc(s.name)}</h1><p class="muted">${esc(s.student_id)} · ${esc(s.cohort||'Unassigned')}</p><span class="muted">${esc(s.status)} account</span></div>${levelBadge(m.level)}</div><div class="stats">${stat('Average assessment score',pct(m.score),m.attempts+' recorded attempts','exams')}${stat('Module completion',pct(m.progress.percent),m.progress.done+' of '+m.progress.total+' assigned modules','courses')}${stat('Learning time',Math.round(cm.minutes/60)+' hrs',rows.length+' recorded learning sessions','overview')}${stat('Last recorded activity',m.last?dayLabel(m.last):'—',m.last?'Within selected period':'No activity in selected period','practice')}</div><div class="grid-two grid-even">${panel('Assessment performance','Daily average for this student',lineChart(daily([s]),'score','Average score','#315f98',true))}${panel('Skill overview','Average recorded assessment score',skillBars([s]))}</div>${panel('Assigned course progress','Completion snapshot for currently assigned modules',Object.keys(grants.courses).map(id=>{const c=M.catalog.find(c=>c.id===id),assigned=grants.courses[id],indices=assigned==='all'?c.mods.map((_,i)=>i):assigned,p=db.analytics.progress.find(p=>p.student===s.id&&p.course===id),n=indices.filter(i=>p&&i<p.completed).length,percent=indices.length?Math.round(n/indices.length*100):0;return `<div class="bar-row"><span>${esc(c.name)}</span><div class="bar-track"><div class="bar-fill" style="width:${percent}%"></div></div><b>${percent}%</b></div><p class="muted" style="font-size:10px">${n} of ${indices.length} assigned modules completed</p>`;}).join('')||'<p class="muted">No active course assignments.</p>')}<section class="panel" style="margin-top:20px"><div class="panel-head"><div><h2>Recent assessment attempts</h2><p>Practice and exam results in the selected period</p></div></div>${attemptTable(rows.filter(e=>e.score!==null))}</section>`;}
function nav(view){if(!pages.some(p=>p[0]===view))return;state.view=view;state.query='';state.level='all';state.page=0;render();window.scrollTo?.(0,0);}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b||b.disabled||!account())return;const {action,view,id}=b.dataset;if(action==='logout'){session=null;sessionStorage.removeItem(SESSION);loginMessage='';state.cohort='all';state.view='overview';render();}else if(action==='nav')nav(view);else if(action==='student'){if(!students().some(s=>s.id===id))return;state.student=id;state.view='student';render();window.scrollTo?.(0,0);}else if(action==='page'){state.page=Math.max(0,state.page+Number(b.dataset.dir));$('#studentTable').innerHTML=studentTable();}});
document.addEventListener('change',e=>{if(!account())return;if(e.target.id==='periodFilter'){state.days=[7,28].includes(+e.target.value)?+e.target.value:28;state.page=0;render();}else if(e.target.id==='cohortFilter'){state.cohort=e.target.value;state.page=0;render();}else if(e.target.id==='signalFilter'){state.level=e.target.value;state.page=0;$('#studentTable').innerHTML=studentTable();}});
document.addEventListener('input',e=>{if(account()&&e.target.id==='studentSearch'){state.query=e.target.value;state.page=0;$('#studentTable').innerHTML=studentTable();}});
document.addEventListener('submit',async e=>{
 if(e.target.id!=='memberLogin')return;e.preventDefault();const form=e.target,button=$('button',form);if(button.disabled)return;button.disabled=true;button.textContent='Signing in…';$('#loginError').textContent='';
 try{const f=new FormData(form),email=f.get('email').trim().toLowerCase(),password=f.get('password');db=M.load();const a=db.members.find(m=>m.email.toLowerCase()===email),valid=a&&a.status==='Active'&&db.orgs.some(o=>o.id===a.org&&o.status==='Active')&&await M.verifyCredential(password,a.credential);if(!valid)throw new Error('Email or password is incorrect, or this account is inactive.');
  const fresh=M.load(),current=fresh.members.find(m=>m.id===a.id);if(!current||current.status!=='Active'||current.credentialVersion!==a.credentialVersion||!fresh.orgs.some(o=>o.id===a.org&&o.status==='Active'))throw new Error('Account access changed. Please try again.');db=fresh;session={id:a.id,version:a.credentialVersion||1};sessionStorage.setItem(SESSION,JSON.stringify(session));state.cohort='all';state.view='overview';loginMessage='';form.reset();render();
 }catch(err){$('#loginError').textContent=err.message;button.disabled=false;button.textContent='Sign in →';}
});
window.addEventListener('storage',e=>{if(e.key===M.KEY){try{db=M.load();render();if(account())notice('Analytics refreshed with the latest roster and assignments.');}catch(_){notice('Could not load the updated workspace.');}}});
render();
</script></body></html>
